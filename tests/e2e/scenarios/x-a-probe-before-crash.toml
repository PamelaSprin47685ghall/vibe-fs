# X-A (CTX-006 / FALLBACK-012 / CTX-010): crash after recovery arming, before
# transform assembles a prefix probe.
#
# Sequence: non-retryable provider failure arms the slot (FallbackCursorAdvanced
# lands first — TurnCompletionProgram writes the cursor fact before sending
# ProviderRetryAttempt). Clean Host restart then drops PluginRuntimeScope
# RecoveryArming (FALLBACK-012 afterRestart = NotArmed). Post-restart ordinary
# main has no probe on the wire and never promotes.

scenario = "x-a-probe-before-crash"
description = "X-A: restart after arming, before prefix-probe transform; arming lost, no probe send, no promote"
pass = "X-A canary passed: arming lost across restart; no prefix probe physical send; no PrefixRebaseCommitted."

setup = { strict = true }
session = { agent = "fast-coder", bind = ["coder-title", "fast-coder"] }
prompt = { agent = "fast-coder", text = "X-A round 1 before probe crash." }

must = ["after-restart"]

flow = [
  # Kill as soon as the refused first delivery hits the mock. Host is still
  # reconciling TurnFailed → ArmRecovery → FallbackCursorAdvanced; ProviderRetryAttempt
  # has not yet left the send path. That is the "armed, probe not assembled" window.
  # Do NOT awaitTerminal before awaitRestart: that races SIGTERM on the dying host
  # (host-restart.toml pattern: wait pre-restart edges → awaitRestart → post work).
  { afterExpectation = { id = "round1.0", restart = true } },
  { awaitRestart = true },

  # No continue delivery may have reached the provider with a probe plan.
  { assertDeliveries = { id = "continue.0", eq = 0 } },
  { assertFacts = { name = "PrefixRebaseCommitted", eq = 0 } },
  { assertFacts = { name = "ContextReanchored", eq = 0 } },

  # Fresh human root after restart: ordinary main (NotArmed), not a probe slot.
  # timeoutMs survives forest pressure (host-restart post-restart waits use 15000).
  { prompt = { agent = "fast-coder", text = "X-A post-restart ordinary main." } },
  { wait = "after-restart", timeoutMs = 15000 },
  { awaitEvent = { type = "session.idle", session = "self" }, timeoutMs = 15000 },

  { assertFacts = { name = "PrefixRebaseCommitted", eq = 0 } },
  { assertFacts = { name = "ContextReanchored", eq = 0 } },
  { assertDeliveries = { id = "continue.0", eq = 0 } },
  { custom = "oracle" },
  { expectSatisfied = true },
]

[[turn]]
id = "round1"
lane = "fast-coder"
user = "X-A round 1 before probe crash."
tools = ["write"]

  [[turn.step]]
  respond = { type = "text", text = "unreachable: the first delivery is refused" }

[[turn]]
id = "continue"
internal = true
user = "# Continue after provider failure."

  [[turn.step]]
  respond = { type = "text", text = "unreachable: X-A must never deliver continue before restart" }

[[turn]]
id = "after-restart"
lane = "fast-coder"
user = "X-A post-restart ordinary main."
tools = ["write"]

  [[turn.step]]
  respond = { type = "text", text = "x-a post-restart ordinary main completed." }

[[fault]]
turn = "round1"
step = 0
delivery = "provider-error"
status = 400
retryable = false
attempts = [1]

# No [[epoch]] reason=prefix-probe: probe must not fire. Declaring it would make
# unfiredBoundaries fail closed at scenario end (ARCH-004 / CTX-010).


# Bare MissingFinalReport poke (RuntimeNudge.missingFinalReport = "#\n").
# Optional: only fires when a session stops without a final report.
[[turn]]
id = "missing-final-report-repair"
internal = true
optional = true
user = "#"

  [[turn.step]]
  respond = { type = "text", text = "Continuing after missing final report." }

