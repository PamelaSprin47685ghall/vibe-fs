# HOST-004 + REVIEW-004: a restart must not silently change a Reviewer's tool surface. The
# proof is that after the restart the SAME child session can still call `verdict` — a
# reconcile that dropped the reviewer's schema would leave it answering in prose, which
# looks like a model choice rather than a harness defect.
#
# IMPERFECT exercises the verdict tool without opening REVIEW-003's confirmation round.
# `reviewer-verdict` owns double-PERFECT confirmation; this scenario owns restart recovery.

scenario = "reviewer-restart"
description = "HOST-004 the verdict tool surface survives a restart on the same reviewer child"
pass = "Reviewer restart reconcile canary passed: verdict tool surface intact across restart."

setup = { strict = true, project = { files = { "AGENTS.md" = "reviewer restart reconcile canary\n" } } }
session = { agent = "fast-manager", bind = ["fast-manager"] }

must = ["reviewer-first.0", "reviewer-after-restart.0"]

flow = [
  { createChild = { agent = "fast-reviewer", bind = ["reviewer-title", "fast-reviewer"], title = "reviewer restart canary" } },

  { prompt = { agent = "fast-reviewer", text = "Review the tree and submit a verdict." }, session = "child" },
  { wait = "title" },
  { wait = "reviewer-first.0" },
  { wait = "reviewer-first.1" },
  { awaitTerminal = true, session = "child", requireAssistantTerminal = true, requireIdleAfterActivity = true },

  { restart = true },

  { prompt = { agent = "fast-reviewer", text = "After restart, re-verify the tree with another verdict." }, session = "child" },
  { wait = "reviewer-after-restart.0", timeoutMs = 20000 },
  { wait = "reviewer-after-restart.1" },
  { awaitTerminal = true, session = "child", requireAssistantTerminal = true, requireIdleAfterActivity = true },

  { custom = "oracle" },
  { expectSatisfied = true },
]

# The JSON form numbered these `lane.turn = 1..4` across BOTH user messages, so the ordinal
# was the only thing separating the pre-restart pair from the post-restart pair. They are
# two turns of two steps: `step` restarts at 0 for each new user message, which is what
# makes the boundary a property of the request instead of the author's bookkeeping.

[[turn]]
id = "reviewer-first"
lane = "fast-reviewer"
user = "Review the tree and submit a verdict."
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "IMPERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "The review requires another pass." }

[[turn]]
id = "reviewer-after-restart"
lane = "fast-reviewer"
user = "After restart, re-verify the tree with another verdict."
tools = ["verdict"]

  # If the reconcile lost the reviewer's schema this step cannot be produced at all, which
  # is the whole claim: `verdict` is still on the surface.
  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "IMPERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "The review is complete." }

[[turn]]
id = "title"
lane = "reviewer-title"
kind = "title"
user = "Review the tree and submit a verdict."

  [[turn.step]]
  respond = { type = "title", text = "E2E Test Session" }

# COMPANION-002: every Managed Work Session gets exactly one Companion, so a scenario with a
# work session must say what its Blogger replies — otherwise production sends a request the
# forest cannot answer and the run fail-stops.
#
# Measured in K9: four scenarios were missing this, and all four were red before the rewrite
# for exactly this reason. No lane, because the prompt is composed from the delta alone
# (`src/Wanxiangshu/Session/CompanionHostBlogger.fs:77`) and is identical across sessions.
#

[[turn]]
id = "blogger"
internal = true
