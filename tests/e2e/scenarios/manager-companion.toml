scenario = "manager-companion"
description = "Manager content with one production-composed Blogger request"
session = { agent = "fast-manager", bind = ["manager-title", "manager"] }
prompt = { agent = "fast-manager", text = "Start manager work." }

must = ["manager-title", "manager-first", "manager-activation", "manager-blogger-1"]

flow = [
  { prompt = { text = "Start manager work." } },
  { wait = "manager-first" },
  { wait = "manager-activation" },
  { wait = "manager-blogger-1" },
]

[[turn]]
id = "manager-title"
lane = "manager-title"
kind = "title"
user = "Start manager work."

  [[turn.step]]
  respond = { type = "title", text = "E2E Test Session" }

[[turn]]
id = "manager-first"
lane = "manager"
user = "Start manager work."
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "text", text = "Manager turn 1." }

# GLORY-018/020: the planning terminal triggers exactly one Activation
# continuation; the Manager then works. Production-composed → internal.
[[turn]]
id = "manager-activation"
internal = true
user = ["Now complete it yourself.", "Carry out the work you described until the final goal is fully achieved."]
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "text", text = "Manager working turn." }

# Host may inject a review-guard continuation after an unreviewed manager turn
# settles (RuntimeNudge.managerReviewGuard, GLORY-070). Production-composed → internal.
[[turn]]
id = "manager-guard"
internal = true
user = ["# Your work is not yet complete.", "# Finish what remains, or call suicide when nothing useful remains."]
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "text", text = "Manager review guard acknowledged." }

[[turn]]
id = "manager-blogger-1"
internal = true
user = "# Write the dense work-log continuation now"

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Manager Blogger paragraph 1.", tip = "primitive-obsession" } }

