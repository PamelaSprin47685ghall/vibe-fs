# blogger-quiet-stop — ENFORCER-040/045 + P0 empty-messages loop regression (bdaa616d).
#
# One Blogger request per main-turn material: each main turn commits a blog cycle
# and parks; the next main turn's offer resumes the transform with the cumulative
# delta. Two main turns ⇒ exactly two Blogger requests, both matched by the ONE
# declared blogger step: `step` is the per-request count of assistant messages
# AFTER the last user message, and the second request's last user message is the
# new-material instruction with no assistant after it, so it is step 0 too. Both
# deliveries answer blog tool-calls — exactly two blog calls total. Empty
# messages never reach the provider; no provider-failure continuation (no
# ProviderRetryAttempt / FallbackCursorAdvanced); no third request (the old bug
# was unbounded — a third blog call fail-closes as unmatched against this
# scenario).

scenario = "blogger-quiet-stop"
description = "ENFORCER-040/045 + P0 loop regression: exactly two blog calls (one per main turn material), non-empty messages, no retry/fallback, no third blog request"
session = { agent = "fast-coder", bind = ["coder-title", "fast-coder"] }
prompt = { agent = "fast-coder", text = "First coder turn." }
must = ["coder.0", "blogger.0", "coder-title"]

flow = [
  { prompt = { text = "First coder turn." } },
  { prompt = { text = "Second coder turn." } },
]

[[turn]]
id = "coder"
lane = "fast-coder"
user = "First coder turn."
tools = ["read", "glob", "grep"]

  [[turn.step]]
  respond = { type = "text", text = "coder turn one complete." }

[[turn]]
id = "coder2"
lane = "fast-coder"
user = "Second coder turn."
tools = ["read", "glob", "grep"]

  [[turn.step]]
  respond = { type = "text", text = "coder turn two complete." }

# Production composes the Blogger prompt; match the stable instruction prefix.
# ONE step serves both deliveries: `step` counts assistant messages AFTER the
# last user message, so the second request (new-material instruction as its last
# user message, nothing after it) is also step 0 and matches blogger.0. A third
# blog call is unexpected and fail-closes.
[[turn]]
id = "blogger"
internal = true
user = "# Write the dense work-log continuation now"

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Blogger cycle 1.", tip = "primitive-obsession" } }

# ENFORCER-030: each frame commit rebuilds the Blogger session's provider view —
# the first blog tool result is now in the transcript, so the second request's
# prefix changes from [system|user] to [system|assistant|user]. One declaration
# at blogger.0 governs BOTH deliveries of the entry: the first establishes the
# seal (previousWire is null, nothing to break), the second consumes the
# frame-commit admission (cold-boundary.js handles multi-delivery of one entry;
# unfiredBoundaries only audits prefix-probe, so a frame-commit is not required
# to fire to stay green — here it does fire on the second delivery).
[[epoch]]
turn = "blogger"
step = 0
reason = "frame-commit"

[[turn]]
id = "coder-title"
kind = "title"
lane = "coder-title"
user = "First coder turn."

  [[turn.step]]
  respond = { type = "title", text = "E2E Test Session" }
