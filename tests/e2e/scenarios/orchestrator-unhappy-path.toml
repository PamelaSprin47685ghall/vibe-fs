# orchestrator-unhappy-path — one-stroke Orchestrator unhappy traversal.
#
# Mirrors manager-unhappy-path: one HumanRoot chain walks every ORCH pit that the
# production CE can hit without leaving the publish job, then lands on exactly-once
# Published. Restart-after-claim lives in orchestrator-restart-publish*; this
# scenario owns the conflict/resume trajectory itself (ORCH-003/004/005/006/007).
#
# Strokes:
#   1. fork-manager → ManagerJobCreated (one Job · one worktree · one Manager)
#   2. Manager dual-suicide Finality + coder write candidate
#   3. target diverges after manager.0 (gitConflictProof) → ConflictDetected
#   4. same Manager session receives CONFLICT RESUMPTION (no task restart)
#   5. barrier dual PERFECT → Published eq 1
#   6. orch joins; worktree clean; ManagerAgent identity preserved

scenario = "orchestrator-unhappy-path"
description = "ORCH-003/004/005/006/007 one-stroke: conflicted rebase resumes same Manager and publishes exactly once"
pass = "Orchestrator unhappy path canary passed: conflict → same-Manager resume → exactly-once publish."

setup = { strict = true, project = { files = { "AGENTS.md" = "- orchestrator unhappy path canary\n", "README.md" = "# orchestrator-unhappy-path project\n" } } }
session = { agent = "fast-orchestrator", bind = ["title", "fast-orchestrator"] }
prompt = { agent = "fast-orchestrator", text = "Ship publish_proof.txt to the target branch." }

must = [
  "orch.0",
  "manager.0",
  "coder.0",
  "manager.2",
  "conflict-resume.0",
  "coder-resolve.0",
  "barrier-reviewer.0",
  "orch.2",
]

flow = [
  # Stroke 3: diverge target AFTER the manager worktree exists (see conflict canary).
  { afterExpectation = { id = "manager.0", gitConflictProof = true } },

  # Stroke 1 — fork job + manager dual-suicide Finality + candidate.
  # Production order: Manager Life ends → finalize candidate → rebase → conflict.
  # conflict-resume is a NEW turn on the same Manager session (not manager.3 again).
  { wait = "orch.0" },
  { waitFact = { name = "ManagerJobCreated", eq = 1 } },
  { wait = "manager.0" },
  { wait = "coder.0" },
  { wait = "coder.1" },
  { wait = "manager.1" },
  { wait = "manager.2" },
  { wait = "manager-finality-reviewer.0", timeoutMs = 30000 },
  { wait = "manager-finality-reviewer.1", timeoutMs = 30000 },
  { wait = "manager.3", timeoutMs = 30000 },
  { waitFact = { name = "CandidateReady", eq = 1 }, timeoutMs = 60000 },

  # Stroke 3/4 — conflict + same-Manager resume + coder resolve
  { waitFact = { name = "ConflictDetected", gte = 1 }, timeoutMs = 60000 },
  { wait = "conflict-resume.0", timeoutMs = 60000 },
  { custom = "afterConflictResume" },
  { wait = "coder-resolve.0", timeoutMs = 60000 },
  { wait = "coder-resolve.1", timeoutMs = 60000 },
  { wait = "conflict-resume.1", timeoutMs = 60000 },
  { wait = "conflict-resume.2", timeoutMs = 60000 },

  # Stroke 5 — post-resolve rebase continue → post-rebase review → publish.
  # Bare "Published" false-matches assignment text; pin Orchestrator case tag.
  { waitFact = { name = "RebasedCandidateReady", gte = 1 }, timeoutMs = 90000 },
  { waitFact = { name = "\"Orchestrator\",[\"Published\"", eq = 1 }, timeoutMs = 90000 },

  # Stroke 6 — Orchestrator harvest
  { wait = "orch.2", timeoutMs = 60000 },
  { awaitTerminal = true, requireAssistantTerminal = false },
  { assertFacts = { name = "\"Orchestrator\",[\"Published\"", eq = 1 } },
  { assertFile = { path = "publish_proof.txt", equals = "Published by orchestrator canary\n" } },
  { assertWorktreeClean = true },
  { custom = "finalOracle" },
  { expectSatisfied = true },
]

[[turn]]
id = "orch"
lane = "fast-orchestrator"
user = "Ship publish_proof.txt to the target branch."
tools = ["fork-manager", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork-manager", args = { agent = "fast-manager", prompt = "Ship publish_proof.txt to the target branch." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Publish completed after conflict resume." }

[[turn]]
id = "manager"
lane = "fast-manager"
user = "# Ship publish_proof.txt to the target branch."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", tdd = "green", prompt = "Write publish_proof.txt." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  # Host-owned Finality for AgentOwnerRoot ManagerJob (GLORY-068/069).
  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "publish_proof.txt is ready." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "publish_proof.txt is ready." } }

  [[turn.step]]
  respond = { type = "text", text = "Manager rest in peace." }

[[turn]]
id = "manager-guard"
internal = true
optional = true
user = ["# You are doing well.", "# You have plenty of time.", "# You can continue.", "# When nothing useful remains, call suicide."]
tools = ["fork", "join", "list", "suicide"]

  # GLORY-029/070: ordinary activated idle — ManagerIdleEncouragement only.
  [[turn.step]]
  respond = { type = "text", text = "Manager continues." }

# `src/Wanxiangshu/Application/Orchestration/Orchestrator.Prompts.fs:23`. The prompt embeds the conflicted file list, so the
# declaration is a prefix of it — and production composes the whole thing, hence `internal`.
#
# The clause it carries is the load-bearing part: "You are RESUMING an in-progress rebase in
# this same session — do NOT restart the original task."

[[turn]]
id = "conflict-resume"
internal = true
user = "[CONFLICT RESUMPTION] An in-progress rebase hit conflicts. Conflicted files:"
tools = ["fork", "join", "list", "suicide"]

  # Manager cannot edit files (AGENT tools: fork/join/list/suicide). Resolve via
  # Coder write of the canonical candidate content, then join so finalizeWorktree
  # can git add -A + rebase --continue (GitAdapter.finalizeWorktree).
  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", tdd = "green", prompt = "Resolve the conflicted publish_proof.txt so it contains exactly: Published by orchestrator canary" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Conflict resolved; rebase can continue." }


# HOST-004: Manager missing-final-report (tools gate distinguishes from blogger-repair).
[[turn]]
id = "manager-repair"
internal = true
optional = true
user = "#"
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "text", text = "Manager continues after repair." }

[[turn]]
id = "coder-resolve"
lane = "fast-coder"
user = [
  "# TDD phase: GREEN. Implement the smallest production change that makes the previously established failing test pass. Do not delete, skip, loosen, or rewrite the test merely to obtain green. Do not add unrelated behavior.",
  "# Resolve the conflicted publish_proof.txt so it contains exactly: Published by orchestrator canary",
]
tools = ["write"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "write", args = { filePath = "publish_proof.txt", content = "Published by orchestrator canary\n" } }

  [[turn.step]]
  respond = { type = "text", text = "Conflict file resolved." }

[[turn]]
id = "coder"
lane = "fast-coder"
user = [
  "# TDD phase: GREEN. Implement the smallest production change that makes the previously established failing test pass. Do not delete, skip, loosen, or rewrite the test merely to obtain green. Do not add unrelated behavior.",
  "# Write publish_proof.txt.",
]
tools = ["write"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "write", args = { filePath = "publish_proof.txt", content = "Published by orchestrator canary\n" } }

  [[turn.step]]
  respond = { type = "text", text = "Coder finished." }

[[turn]]
id = "manager-finality-reviewer"
internal = true
user = "# Review the current worktree against all authoritative user requirements."
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Manager finality reviewer confirmed." }

