# HOST-004/EXEC-009 + GLORY: a Host restart mid-run must reconcile from the
# journal, and a restored child must still carry the tools its agent declares.
# The Manager Life is born (GLORY-014), planned, activated (GLORY-018/020), and
# finished via suicide → Host-owned Reviewer → confirmed (GLORY-060). The
# restart fires after the Activation continuation lands; the restored Manager
# nudges the SAME coder child (child-a1) and gets a reply (child-a2).

scenario = "host-restart"
description = "HOST-004 restart reconcile; restored Manager Life continues; restored child retains coder tools"
pass = "Host restart reconcile canary passed: restored child retained coder tools across restart."

setup = { strict = true, project = { files = { "AGENTS.md" = "host restart canary\n" } } }
session = { agent = "fast-manager", bind = ["parent-title", "fast-manager"] }
prompt = { agent = "fast-manager", text = "Fork a coder to write host_restart_proof.txt, join, then finish with suicide when nothing useful remains." }

must = ["manager.0", "manager-activation", "finality-reviewer.1", "manager-after-restart.1", "child-a2"]

flow = [
  { wait = "title" },
  { wait = "manager.0" },
  { wait = "child-a1" },
  { wait = "manager-activation" },
  { awaitTerminal = true, requireAssistantTerminal = true },
  { restart = true },

  # The restart is a fresh process reconciling the journal: the activation was
  # accepted, the Life is active, the coder child is restored with its tools.
  { prompt = { agent = "fast-manager", text = "Nudge the coder child for child-a2." } },
  { wait = "manager-after-restart.0", timeoutMs = 15000 },
  { wait = "child-a2", timeoutMs = 15000 },
  { wait = "manager-after-restart.1", timeoutMs = 15000 },
  { bindChild = { agent = "fast-reviewer", bind = ["fast-reviewer"] } },
  { wait = "finality-reviewer.0" },
  { wait = "finality-reviewer.1" },
  { wait = "finality-reviewer.2" },

  # EXEC-009 layer-4: durable completion blob + retire must exist after join across restart.
  { assertFacts = { name = "HandleCompleted", gte = 1 } },
  { assertFacts = { name = "HandleRetired", gte = 1 } },

  { awaitTerminal = true, requireAssistantTerminal = true },
  { waitFact = { name = "ReviewVerdictRecorded", gte = 2 } },
  { expectSatisfied = true },
]

[[turn]]
id = "title"
lane = "parent-title"
kind = "title"
user = "Fork a coder to write host_restart_proof.txt, join, then finish with suicide when nothing useful remains."

  [[turn.step]]
  respond = { type = "title", text = "E2E Test Session" }

# Planning turn: full tool surface (GLORY-016); fork + join + formal text is a
# legal planning terminal → exactly one Activation continuation (GLORY-018).
[[turn]]
id = "manager"
lane = "fast-manager"
user = "Fork a coder to write host_restart_proof.txt, join, then finish with suicide when nothing useful remains."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", tdd = "green", prompt = "Write host_restart_proof.txt with OK." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Coder joined; plan: verify the file, then seek my end when nothing useful remains." }

[[turn]]
id = "child-a1"
lane = "fast-coder"
user = [
  "# TDD phase: GREEN. Implement the smallest production change that makes the previously established failing test pass. Do not delete, skip, loosen, or rewrite the test merely to obtain green. Do not add unrelated behavior.",
  "# Write host_restart_proof.txt with OK.",
]

  [[turn.step]]
  respond = { type = "tool-call", tool = "write", args = { filePath = "host_restart_proof.txt", content = "OK\n" } }

  [[turn.step]]
  respond = { type = "text", text = "child-a1 done." }

# GLORY-018/020: the planning terminal is answered with the Activation
# continuation. Production-composed → internal.
[[turn]]
id = "manager-activation"
internal = true
user = ["Now complete it yourself.", "Carry out the work you described until the final goal is fully achieved."]
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "text", text = "Activation acknowledged; working." }

# After the restart: the restored Manager nudges the restored coder child
# (child-a1's session) for a second write, then finishes via suicide.
[[turn]]
id = "manager-after-restart"
lane = "fast-manager"
user = "Nudge the coder child for child-a2."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", tdd = "green", prompt = "Report child-a2." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  # GLORY-038: a child's completion event may land after the first join returns;
  # a second join collects it so the ending's outstanding-work check is clean.
  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "host_restart_proof.txt written and verified." } }

  # GLORY-041: the accepted suicide's tool result is the last thing the Manager
  # sees; the Host still runs one more provider step for the tool round.
  [[turn.step]]
  respond = { type = "text", text = "Manager after restart ended." }

# EXEC-016: the Manager's ending is deferred while background work is outstanding;
# the join guard arrives if the blogger/child is still pending. Optional.
[[turn]]
id = "manager-join-guard"
internal = true
optional = true
user = ["# Background work is still outstanding.", "# Call join to collect completed results before finishing."]
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "text", text = "Manager joined." }

[[turn]]
id = "child-a2"
lane = "fast-coder"
user = [
  "# TDD phase: GREEN. Implement the smallest production change that makes the previously established failing test pass. Do not delete, skip, loosen, or rewrite the test merely to obtain green. Do not add unrelated behavior.",
  "# Report child-a2.",
]

  [[turn.step]]
  respond = { type = "text", text = "child-a2 done." }

# GLORY-040: the accepted suicide starts the Host-owned Reviewer. Two PERFECT
# verdicts in one turn: the first issues the REVIEW-003 challenge as its tool
# result, the second confirms via its input seal.
[[turn]]
id = "finality-reviewer"
internal = true
user = "# Review the current worktree against all authoritative user requirements."
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "The second independent PERFECT was accepted for this tree." }

[[turn]]
id = "blogger"
internal = true
user = "# Write the dense work-log continuation now"

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Session background.", tip = "primitive-obsession" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Session background continued.", tip = "primitive-obsession" } }

# The Blogger transcript is append-only between deliveries (ARCH-004); a frame
# commit after the Activation continuation legitimately inserts the Activation
# assistant turn in front of the user delta (same as manager-companion).
[[epoch]]
turn = "blogger"
step = 0
reason = "frame-commit"

[[epoch]]
turn = "blogger"
step = 1
reason = "frame-commit"
