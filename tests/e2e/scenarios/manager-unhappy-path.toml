# manager-unhappy-path — 13-stroke Manager unhappy life (proposal §16).
#
# Harness rules that shape this script:
# 1. type=text ends a provider turn. Tool chains that must stay alive use only
#    tool-call steps until the deliberate end of that Labor phase.
# 2. Reviewer assignment bodies share the OpeningAssignment + BaseInstructions
#    wrapper (`# Review the current worktree against all authoritative user
#    requirements.`). Compile-time reachableTurnIds only sees flow.prompt text,
#    so second fragments are prefix-related to those prompts (labor / MARK-ISSUE-*
#    HumanRoots). Runtime lastUser is OpeningAssignment only (PROMPT-004 omits
#    MARK mid-run from reviewer original_user_requirement) — bindReviewers
#    rewrites entry.turn digests and retires first-round turns so same-lane
#    re-enlistments do not ambiguous-match.
# 3. Stroke 3 wakes a blocked join with a real external user message
#    (wire reason=user_message). Esc/operator_abort is unit-tested separately;
#    session abort is no longer the stroke-3 mechanism. The wake prompt is also
#    the Labor user text consumed on the next Manager turn (PROMPT-004: same Life).
# 4. After FinalityBlessed the suicide tool returns the minor-work continuation
#    on the SAME turn. A new HumanRoot after Blessed opens a NEW Life (planning)
#    once LifeCompleted — so minor work + final suicide stay on the blessing turn.
# 5. mgr-guard remains defined for the operator-abort join-guard path but is
#    unused in this flow. The controlled idle phase ties each Manager idle
#    claim to a real provider terminal and keeps A physically pending through B.

scenario = "manager-unhappy-path"
description = "GLORY-070/EXEC-017/F2-F5: repair, join user_message wake, hidden reviewer rejections, 2N cohort blessing, rest in peace"
pass = "Manager unhappy path canary passed: all 13 strokes traversed."

setup = { strict = true, acceptanceGate = { origin = "ManagerIdleEncouragement", plan = ["defer", "defer"] }, project = { files = { "AGENTS.md" = "manager unhappy path canary\n", "src/main.txt" = "target\n" } } }
session = { agent = "fast-manager", bind = ["mgr-title", "fast-manager"] }
prompt = { agent = "fast-manager", text = "Run the full unhappy path in one turn." }

must = [
  "mgr.0",
  "mgr-repair.0",
  "mgr-activation.0",
  "mgr-activation.1",
  "mgr-labor.0",
  "mgr-labor.2",
  "mgr-fix1.0",
  "mgr-fix1.2",
  "mgr-fix2.0",
  "mgr-fix2.2",
  "mgr-fix2.5",
  "child-c1.0",
  "reviewer-r1.0",
  "reviewer-r2.0",
  "reviewer-r3.0",
  "mgr-idle-a.0",
]

flow = [
  { custom = "bindReviewers" },

  # stroke 1/2: planning → repair → activation
  { wait = "mgr.0" },
  { wait = "mgr-repair.0" },
  { wait = "mgr-activation.0" },
  { waitFact = { name = "WorkActivated", eq = 1 } },

  # stroke 3: join in flight → external user message wakes join (reason=user_message).
  # bindReviewers holds child-c1 SSE open until mgr-labor.0 so drain-before-interrupt
  # cannot harvest a completed child and skip interrupted/user_message.
  { wait = "mgr-activation.1" },
  { prompt = { agent = "fast-manager", text = "Also make sure src/main.txt has exactly the content 'done' before the end." } },
  # stroke 4/5/6: Labor — premature suicide, harvest, first legal suicide
  # (the prompt above is the wake; labor waits follow immediately)
  { wait = "mgr-labor.0" },
  { wait = "child-c1.0" },
  { waitFact = { name = "HandleCompleted", gte = 1 } },
  { wait = "mgr-labor.1", timeoutMs = 180000 },
  { wait = "mgr-labor.2" },
  { wait = "reviewer-r1.0" },
  { wait = "reviewer-r1.1" },
  { waitFact = { name = "FinalityRejected", eq = 1 } },
  { custom = "noWitnessAtFirstRejection" },
  # Controlled GLORY-029 phase: labor terminal → A receipt/provider terminal →
  # B receipt/provider terminal. Arm delivery two before A can become idle, so
  # the second barrier binds B's real provider lifecycle rather than reusing an
  # already-consumed delivery signal.
  { armIdle = { id = "mgr-idle-a.0", attempts = 2 } },
  { awaitIdle = { after = "mgr-labor.3", arm = "mgr-idle-a.0", session = "self" } },
  { custom = "firstIdleReceipt" },
  { awaitIdle = { after = "mgr-idle-a.0", attempts = 2, session = "self" } },
  { custom = "secondIdleReceipt" },

  # stroke 7/8: fix-one → second suicide → R1+R2
  { prompt = { agent = "fast-manager", text = "MARK-ISSUE-ONE: C1 is fixing issue one and will report back." } },
  { wait = "mgr-fix1.0" },
  { wait = "child-fix1.0" },
  { wait = "mgr-fix1.1" },
  { wait = "mgr-fix1.2" },
  { wait = "reviewer-r1b.0" },
  { wait = "reviewer-r2.0" },
  { wait = "reviewer-r1b.1" },
  { wait = "reviewer-r2.1" },
  { wait = "reviewer-r1b.2" },
  { wait = "reviewer-r2.2" },
  { waitFact = { name = "FinalityRejected", eq = 2 } },
  { wait = "mgr-fix1.3" },

  # stroke 9–13: fix-two → third suicide (2N bless) → minor → final rest in peace
  { prompt = { agent = "fast-manager", text = "MARK-ISSUE-TWO: C1 is fixing issue two and will verify before seeking the end." } },
  { wait = "mgr-fix2.0" },
  { wait = "child-fix2.0" },
  { wait = "mgr-fix2.1" },
  { wait = "mgr-fix2.2" },
  # Third suicide drives Host Finality to completion before the tool result returns,
  # so a mid-cohort "not yet blessed" custom races dual-PERFECT and is not stable.
  # finalOracle owns FinalityRejected>=2 + FinalityBlessed=1.
  { wait = "reviewer-r2b.0" },
  { wait = "reviewer-r3.0" },
  { wait = "reviewer-r2b.1" },
  { wait = "reviewer-r3.1" },
  { wait = "reviewer-r2b.2" },
  { wait = "reviewer-r3.2" },
  # Blessing can lag while Companion/blogger still appends; bare waitFact keeps
  # the 5s silence window and dies on non-renewing journal noise. Widen window
  # and renew on intermediate finality/review facts (VERIFY-004 renewOn).
  { waitFact = { name = "FinalityBlessed", gte = 1, renewOn = ["ReviewVerdictRecorded", "ConfirmedReviewWitness", "FinalityReviewerEnlisted"] }, timeoutMs = 180000 },
  # Blessed tool result continues this same turn:
  { wait = "mgr-fix2.3" },
  { wait = "child-minor.0" },
  { wait = "mgr-fix2.4" },
  { wait = "mgr-fix2.5" },
  { waitFact = { name = "LifeCompleted", gte = 1 } },
  { awaitTerminal = true, requireAssistantTerminal = true },
  { custom = "finalOracle" },
  { expectSatisfied = true },
]

[[turn]]
id = "mgr-title"
lane = "mgr-title"
kind = "title"
user = "Run the full unhappy path in one turn."

  [[turn.step]]
  respond = { type = "title", text = "Manager Unhappy Path" }

[[turn]]
id = "mgr"
lane = "fast-manager"
user = "Run the full unhappy path in one turn."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "reasoningOnly" }

[[turn]]
id = "mgr-repair"
internal = true
optional = true
# Prefix "#" alone is too weak: dual-PERFECT challenge lastUser also starts with
# "#" and tools=verdict. Without a manager tool gate this entry steals the
# challenge forever (measured: mgr-repair.0 ×200+ on "# Nope, let's re-evaluate",
# FinalityBlessed never lands).
user = "#"
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "text", text = "Continuing." }

[[turn]]
id = "mgr-activation"
internal = true
user = ["# Now complete it yourself.", "# Carry out the work you described until the final goal is fully achieved."]
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", prompt = "Write src/main.txt with 'done'." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

# Optional/unused in this flow: operator-abort join guard (Esc path unit-tested).
[[turn]]
id = "mgr-guard"
internal = true
optional = true
user = ["# Background work is still outstanding.", "# Call join to collect completed results before finishing."]
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "text", text = "The join was interrupted by the operator." }

[[turn]]
id = "mgr-idle-a"
internal = true
user = ["# You are doing well.", "# You have plenty of time.", "# You can continue.", "# When nothing useful remains, call suicide."]
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "text", text = "Manager continues." }

[[turn]]
id = "mgr-labor"
lane = "fast-manager"
user = "Also make sure src/main.txt has exactly the content 'done' before the end."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "premature" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "first ending" } }

  [[turn.step]]
  respond = { type = "text", text = "First ending rejected; continue." }

[[turn]]
id = "mgr-fix1"
lane = "fast-manager"
user = "MARK-ISSUE-ONE: C1 is fixing issue one and will report back."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", prompt = "C1 is fixing issue one and will report back. Fix src/main.txt to contain 'done'." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "second ending" } }

  [[turn.step]]
  respond = { type = "text", text = "Second ending rejected; continue." }

# Blessing turn: after third suicide's Blessed tool result, minor work + final
# suicide continue on the same provider turn (no new HumanRoot).
[[turn]]
id = "mgr-fix2"
lane = "fast-manager"
user = "MARK-ISSUE-TWO: C1 is fixing issue two and will verify before seeking the end."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", prompt = "C1 is fixing issue two and will verify before seeking the end. Fix the remaining issues." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "third ending" } }

  # Blessed → minor-work tool result continues here. Resource-safety after
  # blessing is the same GLORY-037 check already exercised on stroke 5; a
  # mock child that finishes instantly would make a mid-chain "blocked"
  # suicide race into a real second ending, so Labor after blessing is
  # gather-then-final only.
  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", prompt = "Fix all minor issues from the work logs." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "FINAL" } }

  [[turn.step]]
  respond = { type = "text", text = "FINAL" }

[[turn]]
id = "child-c1"
lane = "fast-coder"
user = "# Write src/main.txt with 'done'."

  [[turn.step]]
  respond = { type = "text", text = "C1 wrote src/main.txt with 'done'." }

[[turn]]
id = "child-fix1"
lane = "fast-coder"
user = "# C1 is fixing issue one and will report back."

  [[turn.step]]
  respond = { type = "text", text = "C1 fixed issue one." }

[[turn]]
id = "child-fix2"
lane = "fast-coder"
user = "# C1 is fixing issue two and will verify before seeking the end."

  [[turn.step]]
  respond = { type = "text", text = "C1 fixed issue two." }

[[turn]]
id = "child-minor"
lane = "fast-coder"
user = "# Fix all minor issues from the work logs."

  [[turn.step]]
  respond = { type = "text", text = "C1 fixed the minor issues." }

[[turn]]
id = "reviewer-r1"
lane = "reviewer-r1"
# Compile: last fragment is prefix-related to the stroke-3 labor flow.prompt.
# Runtime: bindReviewers rewrites turn to OpeningAssignment only (production wire).
user = [
  "# Review the current worktree against all authoritative user requirements.",
  "Also make sure src/main.txt",
]
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "REVISE" } }

  [[turn.step]]
  respond = { type = "text", text = "R1 rejects the ending." }

[[turn]]
id = "reviewer-r1b"
lane = "reviewer-r1"
# Compile: last fragment ties to MARK-ISSUE-ONE flow.prompt (reachableTurnIds).
# Runtime starts non-matching until r1 is retired; then turn becomes OpeningAssignment.
user = [
  "# Review the current worktree against all authoritative user requirements.",
  "MARK-ISSUE-ONE",
]
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "R1 confirms the ending." }

[[turn]]
id = "reviewer-r2"
lane = "reviewer-r2"
# Lane reviewer-r2 (cohort with r1b). Compile fragment shared with r1b; lanes differ.
user = [
  "# Review the current worktree against all authoritative user requirements.",
  "MARK-ISSUE-ONE",
]
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "REVISE" } }

  [[turn.step]]
  respond = { type = "text", text = "R2 rejects the ending." }

[[turn]]
id = "reviewer-r2b"
lane = "reviewer-r2"
# Compile: MARK-ISSUE-TWO flow.prompt. Runtime activates after r2.2 retire.
user = [
  "# Review the current worktree against all authoritative user requirements.",
  "MARK-ISSUE-TWO",
]
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "R2 confirms the ending." }

[[turn]]
id = "reviewer-r3"
lane = "reviewer-r3"
# Lane reviewer-r3 (cohort with r2b). Compile fragment shared with r2b; lanes differ.
user = [
  "# Review the current worktree against all authoritative user requirements.",
  "MARK-ISSUE-TWO",
]
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "R3 confirms the ending." }

[[turn]]
id = "reviewer-repair"
internal = true
optional = true
user = ["# Your previous response did not submit a verdict.", "# Continue the review and submit PERFECT or REVISE with the verdict tool."]
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  # Same lastUser can continue as step 1 after the tool result (measured:
  # no-declared-turn at reviewer-r2 step=1 with this repair as lastUser).
  [[turn.step]]
  respond = { type = "text", text = "Repaired Reviewer submitted the tool verdict." }

# REVIEW-003 dual-PERFECT challenge: first PERFECT returns this as the next
# lastUser. Heavier than bare "#" and tools=verdict (mgr-repair is manager-only).
[[turn]]
id = "reviewer-confirm"
internal = true
optional = true
user = "# Nope, let's re-evaluate:"
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Reviewer confirmed the tree after re-evaluation." }

[[turn]]
id = "blogger"
internal = true
user = "# Write the dense work-log continuation now by calling the blog tool exactly once"

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Manager unhappy path.", tip = "primitive-obsession" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Manager unhappy path continued.", tip = "primitive-obsession" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Manager unhappy path cycle 2.", tip = "primitive-obsession" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Manager unhappy path cycle 3.", tip = "primitive-obsession" } }

# Missing-final-report nudge is bare "#" (RuntimeNudge.MissingFinalReport).
# After mgr-repair gained tools=[fork/join/list/suicide], blogger no longer
# falls into that catch-all; declare a blog-scoped optional continue.
# Measured: bare-hash can land at step=1 with only blogger.1 as candidate when
# blogger-continue had only step 0 — expand multi-step optional tool chain.
[[turn]]
id = "blogger-continue"
internal = true
optional = true
user = "#"
tools = ["blog"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Blogger continue after bare-hash nudge.", tip = "primitive-obsession" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Blogger continue step 1 after bare-hash nudge.", tip = "primitive-obsession" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Blogger continue step 2 after bare-hash nudge.", tip = "primitive-obsession" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Blogger continue step 3 after bare-hash nudge.", tip = "primitive-obsession" } }

# Protocol repair after undeclared blogger stop (tools=["blog"]). Optional recovery;
# not in must. Production lastUser starts with "# Protocol repair".
[[turn]]
id = "blogger-repair"
internal = true
optional = true
user = "# Protocol repair"
tools = ["blog"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Repair acknowledged.", tip = "primitive-obsession" } }

[[epoch]]
turn = "blogger-repair"
step = 0
reason = "frame-commit"

# Bare "#" MissingFinalReport on blogger may rewrite message prefix while tools
# stay blog-only (measured seal-undeclared without this boundary).
[[epoch]]
turn = "blogger-continue"
step = 0
reason = "frame-commit"

[[epoch]]
turn = "blogger-continue"
step = 1
reason = "frame-commit"

[[epoch]]
turn = "blogger-continue"
step = 2
reason = "frame-commit"

[[epoch]]
turn = "blogger-continue"
step = 3
reason = "frame-commit"

[[epoch]]
turn = "blogger"
step = 0
reason = "frame-commit"

[[epoch]]
turn = "blogger"
step = 1
reason = "frame-commit"

[[epoch]]
turn = "blogger"
step = 2
reason = "frame-commit"

[[epoch]]
turn = "blogger"
step = 3
reason = "frame-commit"
