id = "blogger-repair"
internal = true
user = "#\n"
tools = ["blog"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Session background after repair.", tip = "primitive-obsession" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Session background after repair continued.", tip = "primitive-obsession" } }

# Attempt 1 of `continue` is a recovery-slot request and carries an attempt-local
# prefix probe: the failed `prove` attempt armed the slot, and the provider-visible
# side can advance to B here. The probe rebases the message prefix while the system
# prompt and tool set stay byte-identical, which ARCH-004 admits as an explicit cold
# boundary. Later deliveries of the same entry are append-only and need no second
# declaration — the boundary is consumed by the request whose break it admitted.
[[epoch]]
turn = "continue"
step = 0
reason = "prefix-probe"

[[epoch]]
turn = "repair"
step = 0
reason = "frame-commit"

