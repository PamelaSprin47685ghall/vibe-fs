internal = true
user = "# Rewrite the preceding assistant work-log frames now by calling the blog tool\n# exactly once. Put the rewritten frame in `text`, set required tip to one catalog\n# field, and do not output ordinary assistant prose."
tools = ["blog"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Rewritten work-log frame.", tip = "primitive-obsession" } }

[[turn]]
id = "repair"
internal = true
user = "# Protocol repair\n\nCall the blog tool exactly once with non-empty text. Do not answer in prose."

  [[turn.step]]
  respond = { type = "text", text = "repair unreachable: consumed by recovery" }

