# X-B (CTX-010 / CTX-012): prefix probe reached the provider; Host restart before
# the attempt is reconciled as Completed + promotable. AttemptPlans are runtime-only
# (PluginRuntimeScope) — restart drops the plan, so reconcileAttempt never promotes.
# Same physical probe key must not be re-sent as a duplicate of the lost plan.

scenario = "x-b-probe-sent-unaccepted"
description = "X-B: probe delivered once, restart before promote; no PrefixRebaseCommitted; no duplicate probe send"
pass = "X-B canary passed: one physical continue delivery, no promote, no re-send of lost AttemptPlan."

setup = { strict = true }
session = { agent = "fast-coder", bind = ["coder-title", "fast-coder"] }
prompt = { agent = "fast-coder", text = "X-B round 1 probe sent unaccepted." }

must = ["continue", "after-restart"]

flow = [
  # Restart as soon as continue.0 is matched at the mock (probe already on the wire
  # after transform). Host may still be streaming; promote requires TurnCompleted +
  # durable append — kill before that leaves PrefixRebaseCommitted = 0.
  { afterExpectation = { id = "continue.0", restart = true } },

  { wait = "continue" },
  { awaitRestart = true },

  { assertDeliveries = { id = "continue.0", eq = 1 } },
  { assertFacts = { name = "PrefixRebaseCommitted", eq = 0 } },
  { assertFacts = { name = "ContextReanchored", eq = 0 } },

  { prompt = { agent = "fast-coder", text = "X-B post-restart ordinary main." } },
  { wait = "after-restart", timeoutMs = 15000 },
  { awaitEvent = { type = "session.idle", session = "self" }, timeoutMs = 15000 },

  # Lost AttemptPlan must not cause a second physical continue for the same plan.
  { assertDeliveries = { id = "continue.0", eq = 1 } },
  { assertFacts = { name = "PrefixRebaseCommitted", eq = 0 } },
  { custom = "oracle" },
  { expectSatisfied = true },
]

[[turn]]
id = "round1"
lane = "fast-coder"
user = "X-B round 1 probe sent unaccepted."
tools = ["write"]

  [[turn.step]]
  respond = { type = "text", text = "unreachable: the first delivery is refused" }

[[turn]]
id = "continue"
internal = true
user = "# Continue after provider failure."

  [[turn.step]]
  respond = { type = "text", text = "x-b continue probe body (may be cut by restart)." }

[[turn]]
id = "after-restart"
lane = "fast-coder"
user = "X-B post-restart ordinary main."
tools = ["write"]

  [[turn.step]]
  respond = { type = "text", text = "x-b post-restart ordinary main completed." }

[[fault]]
turn = "round1"
step = 0
delivery = "provider-error"
status = 400
retryable = false
attempts = [1]

# CTX-010: recovery-slot continue carries attempt-local prefix probe.
[[epoch]]
turn = "continue"
step = 0
reason = "prefix-probe"

