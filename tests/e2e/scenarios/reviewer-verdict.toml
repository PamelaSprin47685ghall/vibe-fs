# GLORY-003/058 + REVIEW-003/006: a tree is confirmed only by two PERFECT
# verdicts from two distinct ProviderRunIdentity, the second proving from its
# input seal that it consumed the first's challenge. The confirmation now lives
# in the Host-owned Finality workflow (GLORY-040/058-061): the Manager calls
# suicide, the hidden Reviewer confirms, last_words becomes the answer.
#
# Two sessions: the Manager's ending (suicide → hidden Reviewer → confirmed),
# and a prose-verdict Reviewer that gets nudged (REVIEW-004, unchanged).

scenario = "reviewer-verdict"
description = "GLORY-058/060 hidden Reviewer dual PERFECT confirms a suicide; REVIEW-004 nudges prose verdicts"
pass = "Reviewer verdict canary passed: two distinct PERFECT runs confirmed the ending; the prose-verdict guard nudged."

setup = { strict = true, project = { files = { "review_target.txt" = "review target\n" } } }
session = { agent = "fast-manager", bind = ["manager-title", "fast-manager"] }
prompt = { agent = "fast-manager", text = "Plan and then finish review_target.txt work with suicide when nothing useful remains." }

must = ["finality-reviewer.0", "reviewer-nudged", "finality-reviewer-challenge.0"]

flow = [
  { wait = "manager.0" },
  { wait = "manager-activation" },
  { wait = "finality-reviewer.0" },
  { wait = "finality-reviewer-challenge.0" },
  { waitFact = { name = "ReviewVerdictRecorded", eq = 2 } },
  { wait = "finality-reviewer-challenge.1" },
  # Blessed is the first suicide's tool result; second suicide is the next
  # provider step of the same activation turn.
  { wait = "manager-activation.1" },
  { wait = "manager-activation.2" },
  { waitFact = { name = "FinalityBlessed", eq = 1 } },
  { waitFact = { name = "LifeCompleted", eq = 1 } },
  { awaitTerminal = true, requireAssistantTerminal = true },
  { custom = "oracle" },

  # REVIEW-004. A Reviewer that reviews in prose and never calls the tool.
  { createSession = { agent = "fast-reviewer", bind = ["reviewer-nudge-title", "reviewer-nudge"], as = "nudge" } },
  { prompt = { agent = "fast-reviewer", text = "Review the tree but do not submit a verdict." }, session = "nudge" },
  { wait = "reviewer-nudge.0" },
  { wait = "reviewer-nudged" },

  { expectSatisfied = true },
]

[[turn]]
id = "manager-title"
lane = "manager-title"
kind = "title"
user = "Plan and then finish review_target.txt work with suicide when nothing useful remains."

  [[turn.step]]
  respond = { type = "title", text = "E2E Test Session" }

# Planning turn → exactly one Activation continuation (GLORY-018/020).
[[turn]]
id = "manager"
lane = "fast-manager"
user = "Plan and then finish review_target.txt work with suicide when nothing useful remains."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "text", text = "Plan: verify review_target.txt, then seek my end when nothing useful remains." }

[[turn]]
id = "manager-activation"
internal = true
user = ["# Now complete it yourself.", "# Carry out the work you described until the final goal is fully achieved."]
tools = ["fork", "join", "list", "suicide"]

  # First suicide: Host-owned 2N review. Tool result is FinalityBlessed minor-work
  # prompt (not a new user message).
  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "review_target.txt verified and complete." } }

  # After Blessed tool result: second suicide is final (rest in peace).
  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "review_target.txt verified and complete." } }

  [[turn.step]]
  respond = { type = "text", text = "Manager rest in peace." }

# GLORY-040: the accepted suicide starts the Host-owned Reviewer. Two PERFECT
# verdicts in one turn: the first issues the REVIEW-003 challenge as its tool
# result, the second confirms via its input seal (REVIEW-003).
[[turn]]
id = "finality-reviewer"
internal = true
user = "# Review the current worktree against all authoritative user requirements."
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "text", text = "The worktree appears correct." }

[[turn]]
id = "finality-reviewer-challenge"
internal = true
user = "# Nope, let's re-evaluate:"
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "The second independent PERFECT was accepted for this tree." }

# GLORY-029: ordinary idle encouragement may race with other continuations.
[[turn]]
id = "manager-idle"
internal = true
optional = true
user = ["# You are doing well.", "# You have plenty of time.", "# You can continue.", "# When nothing useful remains, call suicide."]
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "text", text = "Manager continues." }

# REVIEW-004: a Reviewer that answers in prose without the verdict tool gets
# nudged with the reviewerVerdictGuard text.
[[turn]]
id = "manager-join-guard"
internal = true
optional = true
user = ["# Background work is still outstanding.", "# Call join to collect completed results before finishing."]
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "text", text = "Manager joined." }

[[turn]]
id = "reviewer-nudge"
lane = "reviewer-nudge"
user = "Review the tree but do not submit a verdict."
tools = ["read", "glob", "grep", "verdict"]

  [[turn.step]]
  respond = { type = "text", text = "I reviewed the tree and it is fine." }

[[turn]]
id = "reviewer-nudged"
internal = true
user = ["# Your previous response did not submit a verdict.", "# Continue the review and submit PERFECT or REVISE with the verdict tool."]
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Nudged Reviewer submitted the tool verdict." }

[[turn]]
id = "reviewer-nudge-title"
lane = "reviewer-nudge-title"
kind = "title"
user = "Review the tree but do not submit a verdict."

  [[turn.step]]
  respond = { type = "title", text = "E2E Test Session" }

[[turn]]
id = "blogger"
internal = true
user = "# Write the dense work-log continuation now"

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Session background.", tip = "primitive-obsession" } }

# The Blogger transcript is append-only between deliveries (ARCH-004); a frame
# commit after the Activation continuation legitimately inserts the Activation
# assistant turn in front of the user delta, so the wire is not a pure append of
# the previous one. Declared like manager-companion's frame-commit epochs.
[[epoch]]
turn = "blogger"
step = 0
reason = "frame-commit"
