# Manager first turn with an attached text file. The Host expands that file into
# synthetic read-output parts on the same physical user message; Prompt Authority
# must still accept the human root and allow manager tools.

scenario = "manager-file-root"
description = "Manager HumanRoot with Host-expanded file parts can still fork a coder"
pass = "Manager file-root canary passed."

setup = { strict = true, project = { files = { "AGENTS.md" = "manager file-root canary\n", "src/main.txt" = "seed\n" } } }
session = { agent = "fast-manager", bind = ["manager-title", "fast-manager"] }
prompt = { agent = "fast-manager", text = "fork a coder with attached file" }

must = ["manager.2", "coder.0"]

flow = [
  { wait = "blogger" },
  { wait = "manager.0" },
  { bindChild = { agent = "fast-coder", bind = ["fast-coder"] } },
  { wait = "coder.0" },
  { wait = "manager.1" },
  { wait = "manager.2" },
  { custom = "assertSyntheticHumanRoot" },
  { expectSatisfied = true },
]

