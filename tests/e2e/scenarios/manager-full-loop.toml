# GLORY-001..003/018/040/058-062: the whole Manager Life in one conversation.
# Planning turn (tools available, GLORY-016) → Host Activation (GLORY-018/020) →
# Labor → suicide(last_words) → Host-owned hidden Reviewer (GLORY-002/003) →
# confirmed dual PERFECT (REVIEW-003) → last_words becomes the user answer
# (GLORY-060/061).
#
# The Manager never forks a Reviewer: the Reviewer lanes below are Host-owned
# (deep-reviewer, opened by FinalityController, invisible to list/join).

scenario = "manager-full-loop"
description = "GLORY: planning → Activation → Labor → suicide → hidden Reviewer → confirmed → last_words terminal"
pass = "Manager full loop canary passed."

setup = { strict = true, project = { files = { "AGENTS.md" = "manager full loop canary\n", "src/main.txt" = "target\n" } } }
session = { agent = "fast-manager", bind = ["manager-title", "fast-manager"] }
prompt = { agent = "fast-manager", text = "Run full manager loop: fork inspector, browser, meditator in parallel, join three reports, fork a coder, then finish with suicide when nothing useful remains." }

must = ["manager.0", "manager.1", "finality-reviewer.0", "finality-reviewer.1"]

flow = [
  { wait = "manager.0" },
  { wait = "manager.1" },
  { bindChild = { agent = "deep-reviewer", bind = ["deep-reviewer"] } },
  { wait = "finality-reviewer.0" },
  { wait = "finality-reviewer.1" },
  { wait = "finality-reviewer.2" },

  { awaitTerminal = true, requireAssistantTerminal = true },
  { waitFact = { name = "ReviewVerdictRecorded", gte = 2 } },
  { expectSatisfied = true },
]

[[turn]]
id = "manager-title"
lane = "manager-title"
kind = "title"
user = "Run full manager loop: fork inspector, browser, meditator in parallel, join three reports, fork a coder, then finish with suicide when nothing useful remains."

  [[turn.step]]
  respond = { type = "title", text = "E2E Test Session" }

# The planning turn: the full tool surface is available (GLORY-016) and the
# Manager may already delegate; ending it with formal text is a legal planning
# terminal that triggers exactly one Activation continuation (GLORY-018).
[[turn]]
id = "manager"
lane = "fast-manager"
user = "Run full manager loop: fork inspector, browser, meditator in parallel, join three reports, fork a coder, then finish with suicide when nothing useful remains."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-inspector", prompt = "Report the current repository structure." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-browser", prompt = "Report the current date." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-meditator", prompt = "Analyze the task split." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Three reports gathered; plan: assign the edit to a Coder, then verify, then seek my end." }

# The forked children answer their delegation prompts (tool calls return
# their results to the Manager's join).
[[turn]]
id = "child-inspector"
lane = "fast-inspector"
user = "# Report the current repository structure."

  [[turn.step]]
  respond = { type = "text", text = "Inspector: repo structure reported." }

[[turn]]
id = "child-browser"
lane = "fast-browser"
user = "# Report the current date."

  [[turn.step]]
  respond = { type = "text", text = "Browser: date reported." }

[[turn]]
id = "child-meditator"
lane = "fast-meditator"
user = "# Analyze the task split."

  [[turn.step]]
  respond = { type = "text", text = "Meditator: split analyzed." }

[[turn]]
id = "child-coder"
internal = true
user = "# TDD phase: GREEN. Implement the smallest production change"

  [[turn.step]]
  respond = { type = "text", text = "Coder: edit applied." }

# GLORY-018/020: the planning terminal is answered by the Host with the
# Activation continuation, whose text this turn matches (production-composed,
# internal). The Manager then works and ends with suicide (GLORY-040).

# EXEC-016: the Manager's ending is deferred while background work (the Blogger
# run) is outstanding; the join guard arrives if the blogger is still pending.
# Optional: a fast blogger finishes first.
[[turn]]
id = "manager-join-guard"
internal = true
optional = true
user = ["# Background work is still outstanding.", "# Call join to collect completed results before finishing."]
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "text", text = "Manager joined." }

# The Host may inject a review-guard continuation after an unreviewed manager
# turn settles (RuntimeNudge.managerReviewGuard, GLORY-070).
[[turn]]
id = "manager-guard"
internal = true
user = ["# Your work is not yet complete.", "# Finish what remains, or call suicide when nothing useful remains."]
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "text", text = "Manager review guard acknowledged." }

[[turn]]
id = "manager.1"
internal = true
user = ["Now complete it yourself.", "Carry out the work you described until the final goal is fully achieved."]
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", tdd = "green", prompt = "Write src/main.txt with 'done'." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  # GLORY-038: a child's completion event may land after the first join returns;
  # a second join collects it so the ending's outstanding-work check is clean.
  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "src/main.txt now contains 'done'." } }

  [[turn.step]]
  respond = { type = "text", text = "Manager ended with suicide." }

# GLORY-040: the accepted suicide starts the Host-owned Reviewer on the current
# tree. First verdict REVISE is not exercised here; the confirmation path is.
# Two PERFECT verdicts in one turn: the first issues the REVIEW-003 challenge as
# its tool result, the second confirms via its input seal.
[[turn]]
id = "finality-reviewer"
internal = true
user = "# Review the current worktree against all authoritative user requirements."
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "The second independent PERFECT was accepted for this tree." }

# GLORY-060: confirmed → the Manager's last_words becomes the user-visible
# terminal; the Manager is not woken again (GLORY-062).

[[turn]]
id = "blogger"
internal = true
user = "# Write the dense work-log continuation now"

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Manager loop background.", tip = "primitive-obsession" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Manager loop background continued.", tip = "primitive-obsession" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Manager loop cycle 2.", tip = "primitive-obsession" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Manager loop cycle 3.", tip = "primitive-obsession" } }

# The Blogger transcript is append-only between deliveries (ARCH-004); a frame
# commit after the Activation continuation legitimately inserts the Activation
# assistant turn in front of the user delta (same as manager-companion).
[[epoch]]
turn = "blogger"
step = 0
reason = "frame-commit"

[[epoch]]
turn = "blogger"
step = 1
reason = "frame-commit"

[[epoch]]
turn = "blogger"
step = 2
reason = "frame-commit"

[[epoch]]
turn = "blogger"
step = 3
reason = "frame-commit"
