# ORCH-005/PERSIST-009: the Host dies after a publish candidate exists but before the
# publish is durably accepted. On restart the job must resume and publish EXACTLY ONCE —
# `Published eq 1` is the whole point, and a second publish would also show up
# as a dirty worktree.
#
# ── recovery is Continue-driven (Host has no auto-recovery) ──────────────────
#
# Host does not re-drive pending tools after restart; recovery is triggered only by new
# input (`runLoop`). Pending join maps to interrupted-error; a new user message anchors a
# new turn (`orch-continue`). Completion criteria = `Published eq 1` journal fact.
# Original-turn `orch.2` is a restart race path: the recovered run may answer the old
# turn again (interrupted join re-delivered at step 1, or the pre-crash join's
# step-2 continuation). It is declared below with a terminal text reply so either
# timeline is deterministic; `optional = true` admits the Continue prompt winning the
# race and anchoring `orch-continue` directly.
#
# ── the recovery file was the same five keys ────────────────────────────────
#
# `orchestrator-restart-publish-recovery.json` held five edges swapped in mid-run by
# `loadScripts`. Measured against the main file's edges, all five had the SAME lane, the
# same `match` predicate and (for three of them) a byte-identical `respond`. The two that
# differed differed only in text — `"Manager recovered."` against `"Manager finished."` —
# and that difference existed solely so the old flow could `wait` on a distinct id.
#
# Under (lane, turn, step) they ARE one key: after the restart the recovered job may open a
# fresh Manager child with the same prompt, so it is a fresh conversation whose step counter
# starts at 0 again. Content is a pure function of the request, so one declaration answers
# both deliveries and the flow simply waits on the same id twice.
#
# What actually proves the recovery is therefore not a differently-worded reply — it is the
# fact assertions and the file assertion at the end of the flow. The old text pair looked
# like evidence and was decoration.

scenario = "orchestrator-restart-publish"
description = "ORCH-005 crash after the publish candidate exists recovers to an exactly-once publish"
pass = "Orchestrator restart publish canary passed: crash-after-candidate recovers to exactly-once publish."

setup = { strict = true, project = { files = { "AGENTS.md" = "- orchestrator restart publish canary (after-candidate)\n", "README.md" = "# orchestrator-restart-publish project (after-candidate)\n" } } }
session = { agent = "fast-orchestrator", bind = ["title", "fast-orchestrator"] }
prompt = { agent = "fast-orchestrator", text = "Ship publish_proof.txt to the target branch." }

must = ["orch-continue.1", "reviewer-confirm.0"]

flow = [
  # The second physical delivery is the post-rebase reviewer. CandidateReady is
  # already durable, while Published cannot exist until this review confirms.
  { afterExpectation = { id = "barrier-reviewer.0", attempts = 2, restart = true } },

  { wait = "orch.0" },
  { wait = "title" },
  { wait = "manager.0" },
  { wait = "coder.0" },
  { wait = "coder.1" },
  { wait = "manager.1" },
  { wait = "manager.2" },
  { wait = "manager-guard.0" },
  { wait = "reviewer.0" },
  { wait = "reviewer.1" },
  { wait = "manager-guard.1" },
  { wait = "manager-guard.2" },
  { wait = "barrier-reviewer.0" },
  { wait = "barrier-reviewer.1" },
  { wait = "barrier-reviewer.2" },
  { wait = "reviewer-confirm.0" },
  { waitFact = { name = "CandidateReady", eq = 1 } },

  { awaitRestart = true },

  # Continue drives recovery (Host has no auto-recovery). No `loadScripts`. Every turn
  # the recovered run needs is declared below and was declared before the Host ever
  # started — which is what makes "the restored job resumes" a claim about production
  # rather than about what the harness swapped in.
  # Completion = Published journal fact; `orch.2` covers the restart race path (the
  # pre-restart join already answered before the crash).
  { prompt = { agent = "fast-orchestrator", text = "Continue the publish job and join its result." } },
  { wait = "orch-continue.0" },
  { wait = "manager.0" },
  { wait = "coder.0" },
  { wait = "coder.1" },
  { wait = "manager.1" },
  { wait = "manager.2" },
  { wait = "manager-guard.0" },
  { wait = "reviewer.0" },
  { wait = "reviewer.1" },
  { wait = "manager-guard.1" },
  { wait = "manager-guard.2" },
  { wait = "barrier-reviewer.0" },
  { wait = "barrier-reviewer.1" },
  { wait = "barrier-reviewer.2" },
  { wait = "reviewer-confirm.0" },
  { waitFact = { name = "Published", eq = 1 }, timeoutMs = 20000 },
  { wait = "orch-continue.1" },

  { awaitTerminal = true, requireAssistantTerminal = false },
  { assertFile = { path = "publish_proof.txt", equals = "Published by orchestrator canary\n" } },
  { assertFacts = { name = "Published", eq = 1 } },
  { assertWorktreeClean = true },
  { expectSatisfied = true },
]

[[turn]]
id = "orch"
lane = "fast-orchestrator"
user = "Ship publish_proof.txt to the target branch."
tools = ["fork-manager", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork-manager", args = { agent = "fast-manager", prompt = "Ship publish_proof.txt to the target branch." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

# orch.2: restart race path. After restart the recovered run may answer the
# old turn again — either the pre-crash join (step-1) was answered and the
# model's next request is this step, or the interrupted join is re-delivered
# at step 1 and this step follows it. The text reply terminates the recovered
# turn deterministically; the Continue prompt then drives `orch-continue` as
# the declared recovery path. `optional = true` because the Continue prompt's
# new user message may win the race and anchor `orch-continue` directly,
# leaving this step unreached on that run.

  [[turn.step]]
  optional = true
  respond = { type = "text", text = "Publish completed after restart." }

# The post-restart continuation is a new user message from the scenario, so it is its own turn.

[[turn]]
id = "orch-continue"
lane = "fast-orchestrator"
user = "Continue the publish job and join its result."
tools = ["fork-manager", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Publish completed." }

# Three steps, answering both the pre-restart Manager and the recovered one. Step 2 is the
# one the JSON form spelled twice as `manager-terminal` and `manager-recovery-terminal`.

[[turn]]
id = "manager"
lane = "fast-manager"
user = "# Ship publish_proof.txt to the target branch."
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", prompt = "Write publish_proof.txt." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Manager finished." }

[[turn]]
id = "manager-guard"
internal = true
user = "# Review is required before completion."
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-reviewer", prompt = "Review the current worktree for correctness" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Manager finished." }

[[turn]]
id = "coder"
lane = "fast-coder"
user = "# Write publish_proof.txt."
tools = ["write"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "write", args = { filePath = "publish_proof.txt", content = "Published by orchestrator canary\n" } }

  [[turn.step]]
  respond = { type = "text", text = "Coder finished." }

[[turn]]
id = "reviewer"
lane = "fast-reviewer"
user = "# Review the current worktree for correctness"
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Reviewer intermediate text after verdict tool." }

[[turn]]
id = "barrier-reviewer"
lane = "deep-reviewer"
user = "# Review the current worktree for correctness. Submit your verdict with the verdict tool."
tools = ["glob", "grep", "inspector", "read", "verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Barrier reviewer completed the double PERFECT." }

[[turn]]
id = "reviewer-confirm"
internal = true
user = "# Nope, let's re-evaluate: does it really fully satisfy the original task without cutting corners?"
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Reviewer confirmed the tree." }

# Both Blogger shapes. The re-anchor frame (`CompanionHostBlogger.fs:72`) is reachable here

