# X-C (CTX-012 / PERSIST-010): probe attempt reaches Completed at Host; promote
# either lands or is the crash window. Clean restart after continue completes.
# Durable facts that must survive: XTrace*, BlogEntryCommitted (RecordCoverage).
# PrefixCoverage only zeroes on ContextReanchored (reanchor), not on failed promote.
# If PrefixRebaseCommitted already committed before kill, X-C still proves XTrace
# and coverage do not retreat; X-D covers promote-then-restart identity.

scenario = "x-c-accepted-before-promote"
description = "X-C: probe completed then restart; XTrace/RecordCoverage survive; PrefixCoverage not zeroed without reanchor"
pass = "X-C canary passed: durable XTrace and coverage survive post-probe restart; no reanchor."

setup = { strict = true }
session = { agent = "fast-coder", bind = ["coder-title", "fast-coder"] }
prompt = { agent = "fast-coder", text = "X-C round 1 accepted before promote." }

must = ["continue", "after-restart"]

flow = [
  { awaitTerminal = { requireIdleAfterActivity = true } },
  { wait = "continue" },
  { waitFact = { name = "FallbackCursorAdvanced", eq = 1 } },
  { awaitEvent = { type = "session.idle", session = "self" }, timeoutMs = 15000 },

  # Snapshot durable counters before restart (oracle reads journal again after).
  { custom = "snapshotBeforeRestart" },

  { restart = true },

  { prompt = { agent = "fast-coder", text = "X-C post-restart ordinary main." } },
  { wait = "after-restart", timeoutMs = 15000 },
  { awaitEvent = { type = "session.idle", session = "self" }, timeoutMs = 15000 },

  { assertFacts = { name = "ContextReanchored", eq = 0 } },
  { assertDeliveries = { id = "continue.0", eq = 1 } },
  { custom = "oracle" },
  { expectSatisfied = true },
]

[[turn]]
id = "round1"
lane = "fast-coder"
user = "X-C round 1 accepted before promote."
tools = ["write"]

  [[turn.step]]
  respond = { type = "text", text = "unreachable: the first delivery is refused" }

[[turn]]
id = "continue"
internal = true
user = "# Continue after provider failure."

  [[turn.step]]
  respond = { type = "text", text = "x-c continue probe completed." }

[[turn]]
id = "after-restart"
lane = "fast-coder"
user = "X-C post-restart ordinary main."
tools = ["write"]

  [[turn.step]]
  respond = { type = "text", text = "x-c post-restart ordinary main completed." }

[[fault]]
turn = "round1"
step = 0
delivery = "provider-error"
status = 400
retryable = false
attempts = [1]

[[epoch]]
turn = "continue"
step = 0
reason = "prefix-probe"

