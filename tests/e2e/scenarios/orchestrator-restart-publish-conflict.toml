# ORCH-005/ORCH-008: the Host dies while an in-progress rebase is CONFLICTED. On restart the
# job must resume the same rebase — not restart the original task — and still publish
# exactly once.
#
# ── recovery is Continue-driven (Host has no auto-recovery) ──────────────────
#
# Host does not re-drive pending tools after restart; recovery is triggered only by new
# input (`runLoop`). Pending join maps to interrupted-error; a new user message anchors a
# new turn (`orch-continue`). Completion criteria = `Published eq 1` journal fact.
# Original-turn `orch.2` is a restart race path: the recovered run may answer the old
# turn again (interrupted join re-delivered at step 1, or the pre-crash join's
# step-2 continuation). Declared below with a terminal text reply; job recovery is
# engine-driven, so the rebase-conflict resume does not depend on it. `optional = true`
# admits the Continue prompt winning the race and anchoring `orch-continue` directly.
#
# ── the recovery file this one loaded was empty ──────────────────────────────
#
# `orchestrator-restart-publish-conflict-recovery.json` was `{"scenario":
# "orch-restart-publish", "scripts": []}` — zero edges. So the `loadScripts` step in the old
# flow swapped in nothing at all, and the post-restart requests were answered by edges the
# main file had already declared.
#
# That is worth stating plainly: a `loadScripts` naming a file with no edges is
# indistinguishable, at runtime, from one that matters. The reader sees dynamic loading and
# assumes the recovery behaviour depends on it. Nothing did.

scenario = "orchestrator-restart-publish-conflict"
description = "ORCH-005 crash during a conflicted rebase resumes the same rebase and publishes exactly once"
pass = "Orchestrator restart publish canary passed: crash-during-rebase-conflict recovers to exactly-once publish."

setup = { strict = true, project = { files = { "AGENTS.md" = "- orchestrator restart publish canary (rebase-conflict)\n", "README.md" = "# orchestrator-restart-publish project (rebase-conflict)\n" } } }
session = { agent = "fast-orchestrator", bind = ["title", "fast-orchestrator"] }
prompt = { agent = "fast-orchestrator", text = "Ship publish_proof.txt to the target branch." }

must = ["conflict-resume.0", "coder-resolve.0", "orch-continue.1"]

flow = [
  # gitConflictProof must land AFTER the manager worktree exists.
  # orch.0 only *declares* fork-manager — afterExpectation fires when the provider
  # request matches, before the tool runs. Committing onto master at orch.0 means
  # the subsequent worktree is forked from that commit; later rebase is a no-op and
  # conflict-resume never fires. manager.0 is the first request in the child
  # worktree session, so the branch point already exists and the target can diverge.
  { afterExpectation = { id = "manager.0", gitConflictProof = true } },
  { afterExpectation = { id = "conflict-resume.0", restart = true } },

  { wait = "orch.0" },
  { waitFact = { name = "ManagerJobCreated", eq = 1 } },
  { wait = "manager.0" },
  { wait = "coder.0" },
  { wait = "coder.1" },
  { wait = "manager.1" },
  { wait = "manager.2" },
  # Manager finality may still be running; Host-owned reviewers answer independently.
  { wait = "manager-finality-reviewer.0", timeoutMs = 20000 },
  { wait = "manager-finality-reviewer.1", timeoutMs = 20000 },
  { wait = "manager.3", timeoutMs = 20000 },
  { wait = "barrier-reviewer.0" },
  { wait = "barrier-reviewer.1" },
  { wait = "barrier-reviewer.2" },
  # Post-restart resume: restart + cold start + journal fold exceed the default
  # 5s silence window under forest pressure. The wait sits AFTER awaitRestart:
  # the recovered rebase request can only fire once the engine booted, so the
  # 30000ms window measures the resume action, not the restart itself (waiting
  # before awaitRestart made the window span an unbounded restart and timed out
  # even at 30000 under 63-launch accumulation). 30000 is the ceiling for the
  # resume chain; beyond it a structural fix is the next step, not another raise.
  { awaitRestart = true },

  # Continue drives recovery (Host has no auto-recovery). Causal order on the common path:
  # Continue → (2nd conflict-resume, only when the rebase still conflicts) →
  # review/confirm → Published → orch-continue join/text.
  # `orch.2` covers the restart race path (the recovered run answering the old turn again).
  # The restart fires at the FIRST conflict-resume delivery (afterExpectation
  # above), so the crash is by construction before resolution: the recovered
  # rebase still conflicts, and ResumeConflictResolution re-sends the prompt. The
  # wait below is therefore a real barrier on the recovery — guaranteed to fire,
  # not a "may or may not" branch — and the 2nd delivery is the same key (same
  # session, same turn; content is a pure function of the request).
  { wait = "conflict-resume.0", timeoutMs = 30000 },
  { prompt = { agent = "fast-orchestrator", text = "Continue the publish job and join its result." } },
  { prompt = { agent = "fast-orchestrator", text = "Continue the publish job and join its result." } },
  { wait = "barrier-reviewer.0", timeoutMs = 20000 },
  { wait = "barrier-reviewer.1", timeoutMs = 20000 },
  { wait = "barrier-reviewer.2", timeoutMs = 20000 },
  # Publish may complete while the Manager finishes Host-owned finality; do not
  # enter join until the fact is durable (join with nothing hangs the tool).
  { wait = "orch-continue.0", timeoutMs = 30000 },
  { wait = "manager.0", timeoutMs = 30000 },
  { wait = "coder.0", timeoutMs = 30000 },
  { wait = "manager.1", timeoutMs = 30000 },
  { wait = "manager.2", timeoutMs = 30000 },
  { wait = "barrier-reviewer.0", timeoutMs = 20000 },
  { wait = "barrier-reviewer.1", timeoutMs = 20000 },
  { wait = "barrier-reviewer.2", timeoutMs = 20000 },
  { waitFact = { name = "Published", eq = 1 }, timeoutMs = 60000 },
  { wait = "orch-continue.1", timeoutMs = 30000 },

  { awaitTerminal = true, requireAssistantTerminal = false },
  { assertFile = { path = "publish_proof.txt", equals = "Published by orchestrator canary\n" } },
  { assertFacts = { name = "Published", eq = 1 } },
  # One job, one worktree, one Manager (ORCH-003): a re-fork of the original
  # task would write a second ManagerJobCreated and go red here.
  { assertFacts = { name = "ManagerJobCreated", eq = 1 } },
  # manager.0 (the Manager's fork) is delivered exactly once: recovery resumes the
  # SAME session, so its already-answered steps are never re-delivered. A production
  # that re-ran the original task — even into the same session — would deliver
  # manager.0 a second time and go red. Placed here, not right after awaitRestart,
  # because the recovery is driven by the first post-restart join (lazy engine
  # init) and the count is only final once the recovery phase has completed.
  { assertDeliveries = { id = "manager.0", eq = 1 } },
  # barrier-reviewer.0 is delivered once by the pre-rebase review (pre-restart) and
  # once by the post-rebase review (post-restart): a production that skipped the
  # post-rebase review would deliver it only once and go red.
  { assertDeliveries = { id = "barrier-reviewer.0", gte = 2 } },
  { assertWorktreeClean = true },
  { expectSatisfied = true },
]

[[turn]]
id = "orch"
lane = "fast-orchestrator"
user = "Ship publish_proof.txt to the target branch."
tools = ["fork-manager", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork-manager", args = { agent = "fast-manager", prompt = "Ship publish_proof.txt to the target branch." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

# orch.2: restart race path. After restart the recovered run may answer the
# old turn again — either the pre-crash join (step-1) was answered and the
# model's next request is this step, or the interrupted join is re-delivered
# at step 1 and this step follows it. The text reply terminates the recovered
# turn deterministically. Recovery is NOT a boot-time sweep: the engine
# initializes lazily on the first engine tool call, and initializeEngine →
# recoverJobs → RecoverManagerJob then resumes the job from its last durable
# fact — here ConflictPending → ResumeConflictResolution, which sends the
# conflict-resume prompt to the SAME manager session. So the manager's
# rebase-conflict resume IS coupled to this session's replies: whichever join
# fires first (this re-delivered step or the Continue prompt's) drives it.
# The Continue prompt then anchors `orch-continue` as the declared recovery
# path. `optional = true` because the Continue prompt's new user message may
# win the race and anchor `orch-continue` directly, leaving this step
# unreached.

  [[turn.step]]
  optional = true
  respond = { type = "text", text = "Publish completed after restart." }

# The post-restart continuation is a new user message from the scenario, so it is its own turn.

[[turn]]
id = "orch-continue"
lane = "fast-orchestrator"
user = "Continue the publish job and join its result."
tools = ["fork-manager", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Publish completed." }

[[turn]]
id = "manager"
lane = "fast-manager"
user = "# Ship publish_proof.txt to the target branch."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", tdd = "green", prompt = "Write publish_proof.txt." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  # Host-owned Finality for AgentOwnerRoot ManagerJob (GLORY-068/069).
  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "publish_proof.txt is ready." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "publish_proof.txt is ready." } }

  [[turn.step]]
  respond = { type = "text", text = "Manager rest in peace." }

[[turn]]
id = "manager-guard"
internal = true
optional = true
user = ["You are doing well.", "You have plenty of time.", "You can continue.", "When nothing useful remains, call suicide."]
tools = ["fork", "join", "list", "suicide"]

  # GLORY-029/070: ordinary activated idle — ManagerIdleEncouragement only.
  [[turn.step]]
  respond = { type = "text", text = "Manager continues." }

# `src/Wanxiangshu/Application/Orchestration/Prompts.fs:23` (`buildConflictResumePrompt`).
# Production embeds the conflicted-file list between the two fragments, so the
# declaration is ordered fragments around it — and production composes the whole
# thing, hence `internal`.
#
# The second fragment is the load-bearing clause: "You are RESUMING an in-progress
# rebase in this same session — do NOT restart the original task." Matching it pins
# ORCH-007's same-session continuation on the wire — a re-forked task (fresh prompt)
# would not carry it and would fail closed instead of passing.

[[turn]]
id = "conflict-resume"
internal = true
user = [
  "[CONFLICT RESUMPTION] An in-progress rebase hit conflicts. Conflicted files:",
  "You are RESUMING an in-progress rebase in this same session — do NOT restart the original task.",
]
tools = ["fork", "join", "list", "suicide"]

  # The Manager has no editor (AGENT tools: fork/join/list/suicide); it resolves
  # the conflicted file through the Coder, joins, then ends its Life with suicide.
  # GLORY-029/070: a Manager's run completes only at suicide — a plain text reply
  # under ConflictPending is deferred forever (IdleEncouragement loop) and the
  # recovery never returns. The pre-restart Life was completed (archived), so the
  # ending opens a NEW migration Life (FinalityTool.ensureMigrationLife) and runs
  # the full Finality cycle: first suicide → Host-owned cohort
  # (manager-finality-reviewer) → second suicide ends the Life. Only then does
  # AwaitManager return and finalizeWorktree stage the resolution and
  # `rebase --continue` (GitAdapter.finalizeWorktree).
  # The fork prompt avoids the literal word "Published": the journal observer
  # counts waitFact facts by substring, and the assignment text lands in the
  # journal — the word would fake a `Published` fact.
  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", tdd = "green", prompt = "Resolve the conflicted publish_proof.txt so it contains exactly the orchestrator canary marker" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "publish_proof.txt is ready." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "publish_proof.txt is ready." } }

  [[turn.step]]
  respond = { type = "text", text = "Manager rest in peace." }

[[turn]]
id = "coder"
lane = "fast-coder"
user = [
  "# TDD phase: GREEN. Implement the smallest production change that makes the previously established failing test pass. Do not delete, skip, loosen, or rewrite the test merely to obtain green. Do not add unrelated behavior.",
  "# Write publish_proof.txt.",
]
tools = ["write"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "write", args = { filePath = "publish_proof.txt", content = "Published by orchestrator canary\n" } }

  [[turn.step]]
  respond = { type = "text", text = "Coder finished." }

[[turn]]
id = "coder-resolve"
lane = "fast-coder"
user = [
  "# TDD phase: GREEN. Implement the smallest production change that makes the previously established failing test pass. Do not delete, skip, loosen, or rewrite the test merely to obtain green. Do not add unrelated behavior.",
  "# Resolve the conflicted publish_proof.txt so it contains exactly the orchestrator canary marker",
]
tools = ["write"]

  # Post-restart conflict resolution: the Manager forks the Coder into the same
  # worktree; the write overwrites the conflicted file with the canonical content
  # so finalizeWorktree's `git add -A` + `rebase --continue` resolve the conflict
  # and the published file passes assertFile.
  [[turn.step]]
  respond = { type = "tool-call", tool = "write", args = { filePath = "publish_proof.txt", content = "Published by orchestrator canary\n" } }

  [[turn.step]]
  respond = { type = "text", text = "Conflict file resolved." }

# The recovered run's join may return interrupted/empty (the publish has not
# landed yet), and the Host then repairs the completed turn: the missing-final-
# report poke (`RuntimeNudge.missingFinalReport = "#\n"`) is sent to the
# ORCHESTRATOR session, not the blogger — the "#" blogger-repair declaration
# cannot answer step 1 of that turn. Declared as "#\n" (weight 2 beats the "#"
# blogger turn for the same wire) with two steps: the Host keeps poking until a
# report lands. Optional: on the green path the turn may complete before the
# poke fires.
[[turn]]
id = "orch-repair"
internal = true
optional = true
user = "#\n"
tools = ["fork-manager", "join"]

  [[turn.step]]
  respond = { type = "text", text = "Orchestrator continues." }

  [[turn.step]]
  respond = { type = "text", text = "Orchestrator continues." }

[[turn]]
id = "manager-repair"
internal = true
optional = true
user = "#\n"
tools = ["fork", "join", "list", "suicide"]

