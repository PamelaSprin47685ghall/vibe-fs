# ORCH-005/ORCH-008: the Host dies while an in-progress rebase is CONFLICTED. On restart the
# job must resume the same rebase — not restart the original task — and still publish
# exactly once.
#
# ── recovery is Continue-driven (Host has no auto-recovery) ──────────────────
#
# Host does not re-drive pending tools after restart; recovery is triggered only by new
# input (`runLoop`). Pending join maps to interrupted-error; a new user message anchors a
# new turn (`orch-continue`). Completion criteria = `Published eq 1` journal fact.
# Original-turn `orch.2` is a non-deterministic race path and is not declared.
#
# ── the recovery file this one loaded was empty ──────────────────────────────
#
# `orchestrator-restart-publish-conflict-recovery.json` was `{"scenario":
# "orch-restart-publish", "scripts": []}` — zero edges. So the `loadScripts` step in the old
# flow swapped in nothing at all, and the post-restart requests were answered by edges the
# main file had already declared.
#
# That is worth stating plainly: a `loadScripts` naming a file with no edges is
# indistinguishable, at runtime, from one that matters. The reader sees dynamic loading and
# assumes the recovery behaviour depends on it. Nothing did.

scenario = "orchestrator-restart-publish-conflict"
description = "ORCH-005 crash during a conflicted rebase resumes the same rebase and publishes exactly once"
pass = "Orchestrator restart publish canary passed: crash-during-rebase-conflict recovers to exactly-once publish."

setup = { strict = true, project = { files = { "AGENTS.md" = "- orchestrator restart publish canary (rebase-conflict)\n", "README.md" = "# orchestrator-restart-publish project (rebase-conflict)\n" } } }
session = { agent = "fast-orchestrator", bind = ["title", "fast-orchestrator"] }
prompt = { agent = "fast-orchestrator", text = "Ship publish_proof.txt to the target branch." }

must = ["conflict-resume.0", "orch-continue.1"]

flow = [
  { afterExpectation = { id = "manager.0", gitConflictProof = true } },
  { afterExpectation = { id = "conflict-resume.0", restart = true } },

  { wait = "orch.0" },
  { wait = "manager.0" },
  { wait = "coder.0" },
  { wait = "coder.1" },
  { wait = "manager.1" },
  { wait = "manager.2" },
  { wait = "manager-guard.0" },
  { wait = "reviewer.0" },
  { wait = "reviewer.1" },
  { wait = "barrier-reviewer.0" },
  { wait = "barrier-reviewer.1" },
  # The guard round's challenge answer (`reviewer-confirm.0`) is NOT awaited
  # before the restart: the rebase conflict interrupts the manager's guard round
  # (the conflict resume busy-nudges the manager mid-join), so the fast
  # reviewer's answer races the restart and legitimately never lands
  # pre-restart. The guard round resumes and confirms on the recovered run.
  { wait = "barrier-reviewer.2" },
  { wait = "conflict-resume.0" },

  { awaitRestart = true },

  # Continue drives recovery (Host has no auto-recovery). Causal order on the common path:
  # Continue → 2nd conflict-resume → review/confirm → Published → orch-continue join/text.
  # orch.2 is not declared (non-deterministic race with Continue).
  # The SAME conflict-resume key, delivered a second time. The JSON form declared this as
  # `manager-conflict-resume-2` at `lane.turn = 5` with `"Resolved rebase resolution."`
  # against the first edge's `"Resuming rebase resolution."` — two different responses for
  # one key, which content-as-a-pure-function forbids. The two texts existed only so the old
  # flow could `wait` on distinct ids; nothing asserted which one arrived.
  { prompt = { agent = "fast-orchestrator", text = "Continue the publish job and join its result." } },
  { wait = "conflict-resume.0" },
  { wait = "reviewer.0" },
  { wait = "reviewer.1" },
  { wait = "barrier-reviewer.0" },
  { wait = "barrier-reviewer.1" },
  { wait = "barrier-reviewer.2" },
  { wait = "reviewer-confirm.0" },
  { wait = "orch-continue.0" },
  { waitFact = { name = "Published", eq = 1 }, timeoutMs = 20000 },
  { wait = "orch-continue.1" },

  { awaitTerminal = true, requireAssistantTerminal = false },
  { assertFacts = { name = "Published", eq = 1 } },
  { assertWorktreeClean = true },
  { expectSatisfied = true },
]

[[turn]]
id = "orch"
lane = "fast-orchestrator"
user = "Ship publish_proof.txt to the target branch."
tools = ["fork-manager", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork-manager", args = { agent = "fast-manager", prompt = "Ship publish_proof.txt to the target branch." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

# The post-restart continuation is a new user message from the scenario, so it is its own turn.

[[turn]]
id = "orch-continue"
lane = "fast-orchestrator"
user = "Continue the publish job and join its result."
tools = ["fork-manager", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Publish completed." }

[[turn]]
id = "manager"
lane = "fast-manager"
user = "# Ship publish_proof.txt to the target branch."
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", tdd = "green", prompt = "Write publish_proof.txt." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Manager finished." }

[[turn]]
id = "manager-guard"
internal = true
user = "# Review is required before completion."
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-reviewer", prompt = "Review the current worktree for correctness" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Manager finished." }

# `src/Wanxiangshu/Application/Orchestration/Orchestrator.Prompts.fs:23`. The prompt embeds the conflicted file list, so the
# declaration is a prefix of it — and production composes the whole thing, hence `internal`.
#
# The clause it carries is the load-bearing part: "You are RESUMING an in-progress rebase in
# this same session — do NOT restart the original task."

[[turn]]
id = "conflict-resume"
internal = true
user = "[CONFLICT RESUMPTION] An in-progress rebase hit conflicts. Conflicted files:"
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "text", text = "Resuming rebase resolution." }

[[turn]]
id = "coder"
lane = "fast-coder"
user = [
  "# TDD phase: GREEN. Implement the smallest production change that makes the previously established failing test pass. Do not delete, skip, loosen, or rewrite the test merely to obtain green. Do not add unrelated behavior.",
  "# Write publish_proof.txt.",
]
tools = ["write"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "write", args = { filePath = "publish_proof.txt", content = "Published by orchestrator canary\n" } }

  [[turn.step]]
  respond = { type = "text", text = "Coder finished." }

[[turn]]
id = "reviewer"
lane = "fast-reviewer"
user = "# Review the current worktree for correctness"
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Reviewer intermediate text after verdict tool." }

[[turn]]
id = "barrier-reviewer"
lane = "deep-reviewer"
user = "# Review the current worktree for correctness. Submit your verdict with the verdict tool."
tools = ["glob", "grep", "inspector", "read", "verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Barrier reviewer completed the double PERFECT." }

[[turn]]
id = "reviewer-confirm"
internal = true
user = "# Nope, let's re-evaluate: does it really fully satisfy the original task without cutting corners?"
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Reviewer confirmed the tree." }

