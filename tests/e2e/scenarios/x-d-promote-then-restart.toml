# X-D (CTX-012 / COMPANION-009): PrefixRebaseCommitted already durable, then Host
# restart. ActivePrefixEpoch must replay from journal; no second promote for the
# same probe; next main uses committed epoch (no duplicate PrefixRebaseCommitted).

scenario = "x-d-promote-then-restart"
description = "X-D: promote committed, restart; epoch replayed; no re-promote; XTrace intact"
pass = "X-D canary passed: PrefixRebaseCommitted survives restart once; no re-promote; XTrace preserved."

setup = { strict = true }
session = { agent = "fast-coder", bind = ["coder-title", "fast-coder"] }
prompt = { agent = "fast-coder", text = "X-D round 1 promote then restart." }

must = ["continue", "after-restart"]

flow = [
  { awaitTerminal = { requireIdleAfterActivity = true } },
  { wait = "continue" },
  { waitFact = { name = "FallbackCursorAdvanced", eq = 1 } },
  # Promote is durable only after reconcileAttempt appends PrefixRebaseCommitted.
  # Mirror X-C: let the probe turn idle so seal/promote can finish before we
  # snapshot and restart.
  { awaitEvent = { type = "session.idle", session = "self" }, timeoutMs = 30000 },
  # After idle the promote should already be durable (CTX-012). Snapshot and restart.
  { custom = "snapshotBeforeRestart" },

  { restart = true },

  { prompt = { agent = "fast-coder", text = "X-D post-restart uses committed epoch." } },
  { wait = "after-restart", timeoutMs = 15000 },
  { awaitEvent = { type = "session.idle", session = "self" }, timeoutMs = 15000 },

  # No reanchor. Promote is a hard X-D fact, not an optional race outcome.
  { assertFacts = { name = "ContextReanchored", eq = 0 } },
  { assertFacts = { name = "PrefixRebaseCommitted", eq = 1 } },
  { assertDeliveries = { id = "continue.0", eq = 1 } },
  { custom = "oracle" },
  { expectSatisfied = true },
]

[[turn]]
id = "round1"
lane = "fast-coder"
user = "X-D round 1 promote then restart."
tools = ["write"]

  [[turn.step]]
  respond = { type = "text", text = "unreachable: the first delivery is refused" }

[[turn]]
id = "continue"
internal = true
user = "# Continue after provider failure."

  [[turn.step]]
  respond = { type = "text", text = "x-d continue probe promoted." }

[[turn]]
id = "after-restart"
lane = "fast-coder"
user = "X-D post-restart uses committed epoch."
tools = ["write"]

  [[turn.step]]
  respond = { type = "text", text = "x-d post-restart committed epoch main completed." }

[[fault]]
turn = "round1"
step = 0
delivery = "provider-error"
status = 400
retryable = false
attempts = [1]

[[epoch]]
turn = "continue"
step = 0
reason = "prefix-probe"

# Bare MissingFinalReport poke (RuntimeNudge.missingFinalReport = "#\n").
# Optional: only fires when a session stops without a final report.
[[turn]]
id = "missing-final-report-repair"
internal = true
optional = true
user = "#"

  [[turn.step]]
  respond = { type = "text", text = "Continuing after missing final report." }

[[epoch]]
turn = "missing-final-report-repair"
step = 0
reason = "prefix-probe"

