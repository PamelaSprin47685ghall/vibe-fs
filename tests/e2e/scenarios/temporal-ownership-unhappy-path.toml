# temporal-ownership-unhappy-path — EXEC-017 / HOST-004 / REVIEW-002 ownership proof.
#
# Given: one active Manager Life, one linked child held before physical completion,
# and no queued join interrupt.
# Trigger: user_message interrupts join A; the consumed message starts join B;
# Esc interrupts B and cancels its running child; join C drains that tombstone;
# a replacement child completes and join D drains it; a prose-only Reviewer traverses guard → PERFECT
# → challenge → PERFECT.
# Expected: user_message, operator_abort, completed join results in that order;
# ParentCancelled for the Esc-owned child, CHILD_DONE for its replacement, one
# ReviewerGuard, one ReviewConfirmation, two verdict facts, one witness.
# Forbidden: the user message canceling any child, the old message waking join B,
# any bare "#" repair after Esc, duplicate continuation, or duplicate confirmation.

scenario = "temporal-ownership-unhappy-path"
description = "P0 temporal ownership: attempt-scoped user wake, Esc child cancellation, replacement drain, Reviewer single owner"
pass = "Temporal ownership unhappy path passed: join attempts stayed isolated and Reviewer confirmed exactly once."

setup = { strict = true, project = { files = { "AGENTS.md" = "temporal ownership canary\n", "proof.txt" = "pending\n" } } }
session = { agent = "fast-manager", bind = ["manager-title", "manager"] }
prompt = { agent = "fast-manager", text = "Run the temporal ownership proof with one child and wait for further user direction." }

must = [
  "manager.0",
  "manager-activation.0",
  "manager-activation.1",
  "manager-message.0",
  "manager-drain.0",
  "manager-drain.1",
  "manager-drain.2",
  "manager-drain.3",
  "manager-drain.4",
  "manager-drain.5",
  "child.0",
  "replacement.0",
  "finality-reviewer.0",
  "reviewer-guard.0",
  "reviewer-guard.1",
  "reviewer-challenge.0",
  "reviewer-challenge.1",
]

flow = [
  { custom = "holdChild" },
  { wait = "manager.0" },
  { wait = "manager-activation.0" },
  { wait = "manager-activation.1" },

  # Join A is active. This real external message is both its interrupt and the
  # next Manager turn's user input.
  { prompt = { agent = "fast-manager", text = "The first join was interrupted; start a fresh join and keep waiting for the same child." } },
  { wait = "manager-message.0" },

  # The custom first observes join B physically running. Esc then owns B's
  # operator_abort. An old session latch would have completed B as user_message
  # before this causal checkpoint and the custom fails.
  { custom = "abortFreshJoin" },
  { custom = "awaitOperatorAbort" },
  { custom = "releaseChild" },
  { waitFact = { name = "HandleAbandoned", gte = 1 } },

  # Esc owns cancellation of every running sub-session. Join C reports that
  # tombstone once; join D then drains a replacement's ordinary completion.
  # Neither later attempt inherits an earlier interrupt.
  { prompt = { agent = "fast-manager", text = "The Esc-canceled child is settled; fork one replacement, then drain both child outcomes normally." } },
  { wait = "manager-drain.0" },
  { wait = "replacement.0" },
  { wait = "manager-drain.1" },
  { wait = "manager-drain.2" },
  { wait = "manager-drain.3" },
  { custom = "assertJoinTrajectory" },

  # The same Manager now seeks its end. Its Host-owned Reviewer first answers in
  # prose, then the sole ReviewerWorkflow drives guard → PERFECT → challenge → PERFECT.
  { wait = "finality-reviewer.0" },
  { wait = "reviewer-guard.0" },
  { wait = "reviewer-guard.1" },
  { wait = "reviewer-challenge.0" },
  { wait = "reviewer-challenge.1" },
  { waitFact = { name = "ReviewVerdictRecorded", eq = 2 } },
  { waitFact = { name = "ConfirmedReviewWitness", eq = 1 } },
  { custom = "assertReviewerTrajectory" },

  # First suicide returns Blessed; the next Manager step performs the final
  # rest-in-peace suicide and closes the Life exactly once.
  { wait = "manager-drain.4" },
  { wait = "manager-drain.5" },
  { waitFact = { name = "FinalityBlessed", eq = 1 } },
  { waitFact = { name = "LifeCompleted", eq = 1 } },
  { expectSatisfied = true },
]

[[turn]]
id = "manager-title"
lane = "manager-title"
kind = "title"
user = "Run the temporal ownership proof with one child and wait for further user direction."

  [[turn.step]]
  respond = { type = "title", text = "Temporal Ownership Proof" }

[[turn]]
id = "manager"
lane = "manager"
user = "Run the temporal ownership proof with one child and wait for further user direction."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "text", text = "Plan: activate, fork one child, and keep each join attempt causally isolated." }

[[turn]]
id = "manager-activation"
internal = true
user = ["# Now complete it yourself.", "# Carry out the work you described until the final goal is fully achieved."]
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", tdd = "green", prompt = "Hold proof.txt work until the parent has exercised both interrupt kinds, then report CHILD_DONE." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

[[turn]]
id = "manager-message"
lane = "manager"
user = "The first join was interrupted; start a fresh join and keep waiting for the same child."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

[[turn]]
id = "manager-drain"
lane = "manager"
user = "The Esc-canceled child is settled; fork one replacement, then drain both child outcomes normally."
tools = ["fork", "join", "list", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-inspector", prompt = "Produce replacement CHILD_DONE after Esc." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "Temporal ownership is proven." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "Temporal ownership is proven." } }

  [[turn.step]]
  respond = { type = "text", text = "Manager rest in peace." }

[[turn]]
id = "child"
internal = true
user = "# TDD phase: GREEN. Implement the smallest production change"

  [[turn.step]]
  respond = { type = "text", text = "CANCELED_CHILD_MUST_NOT_COMPLETE" }

[[turn]]
id = "replacement"
internal = true
user = "# Produce replacement CHILD_DONE after Esc."

  [[turn.step]]
  respond = { type = "text", text = "CHILD_DONE" }

[[turn]]
id = "finality-reviewer"
internal = true
user = "# Review the current worktree against all authoritative user requirements."
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "text", text = "The proof target appears internally consistent, but I have not submitted a verdict yet." }

[[turn]]
id = "reviewer-guard"
internal = true
user = ["# Your previous response did not submit a verdict.", "# Continue the review and submit PERFECT or REVISE with the verdict tool."]
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "The first PERFECT awaits skeptical confirmation." }

[[turn]]
id = "reviewer-challenge"
internal = true
user = "# Nope, let's re-evaluate:"
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "The second independent PERFECT confirms the review." }

[[turn]]
id = "blogger"
internal = true
user = "# Write the dense work-log continuation now"

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Temporal ownership trajectory.", tip = "primitive-obsession" } }

[[epoch]]
turn = "blogger"
step = 0
reason = "frame-commit"
