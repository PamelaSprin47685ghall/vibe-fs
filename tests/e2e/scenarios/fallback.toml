# FALLBACK-003/004: a settled provider failure advances the cursor once. The Host's
# non-retryable 400 is reconciled as a completed assistant error, then the production
# completion program sends the ProviderRetryAttempt continuation in the SAME Logical Run.
# The continuation succeeds, so the success path derives ConsecutiveFailureCount = 0
# without writing a cursor fact or moving Offset. The A/A/B/B multi-failure trace lives in
# `fallback-aabb-trace`; this scenario keeps one root so it cannot mistake new HumanRoots
# for one fallback run.
#
# A transport fault never consumes a provider expectation signal. The flow therefore waits
# on the settled terminal/idle transcript, the durable cursor fact, and the real continuation
# response only.

scenario = "fallback"
description = "FALLBACK-003/004 settled non-retryable failure advances once; same-run continuation succeeds without resetting Offset"
pass = "Fallback canary passed: settled failure and same-run continuation are reflected in Host transcript and journal."

setup = { strict = true }
session = { agent = "fast-coder", bind = ["coder-title", "fast-coder"] }
prompt = { agent = "fast-coder", text = "Round 1 fallback attempt." }

must = ["continue"]

flow = [
  # The fault does not wake the strict provider expectation queue. Await the real Host
  # terminal/idle transition, then the durable fact written by FallbackController.
  { awaitTerminal = true, requireAssistantTerminal = true, requireIdleAfterActivity = true },
  # The continuation response is the causal wake for the rest of the flow. It is waited
  # on BEFORE the journal fact: `waitFact` polls on 500ms slices, and by the time the
  # fact is observed the continuation's SSE (and its session.idle) may already be over —
  # an `awaitEvent` after it would wait for an idle that never comes again.
  { wait = "continue" },
  # The durable cursor fact is written before the continuation is sent, so it is
  # guaranteed to exist by the time the continuation response has been consumed.
  { waitFact = { name = "FallbackCursorAdvanced", eq = 1 } },
  { awaitEvent = { type = "session.idle", session = "self" } },
  { custom = "oracle" },
  { expectSatisfied = true },
]

# The first delivery is a settled, non-retryable provider failure. Because the Host has
# stopped retrying, TurnCompletionProgram reconciles TurnFailed and sends the internal
# ProviderRetryAttempt prompt below. Its successful response is the only response edge.
[[turn]]
id = "round1"
lane = "fast-coder"
user = "Round 1 fallback attempt."
tools = ["write"]

  [[turn.step]]
  respond = { type = "text", text = "unreachable: the first delivery is refused" }

[[turn]]
id = "continue"
internal = true
user = "# Continue after provider failure."

  [[turn.step]]
  respond = { type = "text", text = "fallback continuation completed." }

[[fault]]
turn = "round1"
step = 0
delivery = "provider-error"
status = 400
retryable = false
attempts = [1]

# CTX-010: the failed attempt arms the recovery slot, so the continuation below
# carries an attempt-local X prefix probe — the committed prefix is replaced by the
# companion-memory head. ARCH-004 admits that as an explicit cold boundary; the
# system prompt and tool set stay byte-identical while the message prefix rebases.

# Production composes the Blogger prompt itself (`CompanionHostBlogger.fs:72,77,118`),
# so no scenario text reaches this lane — hence `internal`. Every Blogger request is at
# step 0: each Companion submit appends the new delta as a fresh user message with no
# assistant after it, so one declaration answers append, squash and re-anchor alike.
# That is what the retired `neverEnd` flag was reaching for.

# ENFORCER-045: coverage advances only via BlogEntryCommitted from a completed
# blog tool cycle. A plain text reply never commits a frame, so PrefixCoverage
# stays at 0 and the continue turn's prefix-probe never materialises.

# Bare MissingFinalReport poke (RuntimeNudge.missingFinalReport = "#\n").
# Optional: only fires when a session stops without a final report.
[[turn]]
id = "missing-final-report-repair"
internal = true
optional = true
user = "#"

  [[turn.step]]
  respond = { type = "text", text = "Continuing after missing final report." }

[[turn]]
id = "blogger"
internal = true
user = "# Write the dense work-log continuation now"

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Coder background.", tip = "primitive-obsession" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Coder background continued.", tip = "primitive-obsession" } }

  # ENFORCER-030: frame commit rebuilds the Blogger provider view (frame list +
  # delta). Declare the cold boundary so ARCH-004 does not fail closed.

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Blogger cycle 2.", tip = "primitive-obsession" } }

