# AGENT-007: Coder may reach a fact through the opaque `inspector` tool, and its
# schema contains no `executor`. The coder turn below declares
# `forbiddenTools = ["executor"]`, and the harness tools gate (runtime-key.js)
# fails the turn closed if `executor` appears on the wire — the mock sees the
# request's tool list, so the absence is asserted, not assumed.
#
# EXEC-026/028: dedicated SyncDelegate Inspector (Returned → Completion), not
# dispose-after. Coder asks twice; bindChild pins one fast-inspector Session so
# both answers reuse the same dedicated child (mirrors Student→Teacher return
# then SyncDelegateReturnCompletion).

scenario = "inspector-oneshot"
description = "AGENT-007 Coder investigates through SyncDelegate inspector (reusable Session) twice and stops"
pass = "Inspector SyncDelegate canary passed: coder invoked reusable inspector twice on one dedicated Session."

setup = { strict = true, project = { files = { "AGENTS.md" = "Inspector SyncDelegate canary\n" } } }
session = { agent = "fast-coder", bind = ["coder-title", "fast-coder"] }
prompt = { agent = "fast-coder", text = "Use inspector twice to investigate two precise workspace facts. Then stop with a short summary." }

# COMPANION-005: the Blogger is not part of what this scenario asserts, so it is
# absent from `must`. The JSON form said the same thing with `blocking = false` — a
# matching flag that also changed how the edge was selected. `must` separates the two
# questions: what may arrive, and what has to.
must = ["coder.0", "inspector-q1", "coder.1", "inspector-q2", "coder.2"]

flow = [
  { wait = "title" },
  { wait = "coder.0" },
  { bindChild = { agent = "fast-inspector", bind = ["fast-inspector"] } },
  { wait = "inspector-q1" },
  { wait = "coder.1" },
  { wait = "inspector-q2" },
  { wait = "coder.2" },
  { wait = "blogger.0" },
  { awaitTerminal = true, requireAssistantTerminal = true },
  { expectSatisfied = true },
]

[[turn]]
id = "coder"
lane = "fast-coder"
user = "Use inspector twice to investigate two precise workspace facts. Then stop with a short summary."
# AGENT-006: Coder matrix has inspector but no executor.
tools = ["inspector"]
forbiddenTools = ["executor"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "inspector", args = { prompt = "Q1: Inspect AGENTS.md and return its first line." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "inspector", args = { prompt = "Q2: Inspect the workspace root and return the file names present." } }

  [[turn.step]]
  respond = { type = "text", text = "Inspector investigation complete." }

# SyncDelegate dual-await: return(message) then fixed SyncDelegateReturnCompletion.
# Lane is bound from the Host session snapshot by agent (bindChild), like other
# dedicated children; both Q1 and Q2 land on the same fast-inspector Session.

[[turn]]
id = "inspector-q1"
lane = "fast-inspector"
user = "Q1: Inspect AGENTS.md and return its first line."

  [[turn.step]]
  respond = { type = "tool-call", tool = "return", args = { message = "AGENTS.md first line is Inspector SyncDelegate canary." } }

  [[turn.step]]
  respond = { type = "text", text = "Sync delegate answer returned to caller." }

[[turn]]
id = "inspector-q2"
lane = "fast-inspector"
user = "Q2: Inspect the workspace root and return the file names present."

  [[turn.step]]
  respond = { type = "tool-call", tool = "return", args = { message = "Workspace root contains AGENTS.md." } }

  [[turn.step]]
  respond = { type = "text", text = "Sync delegate answer returned to caller." }

# One declaration answers every Blogger request, and `neverEnd` is gone.
#
# Each Companion submit appends a fresh delta as a new user message in the Blogger
# session, so every Blogger request has that delta as its LAST user message and no
# assistant after it — step 0, every time. The three production prompts
# (src/Wanxiangshu/Session/CompanionHostBlogger.fs:72,77,118) all begin with the sentence
# below, so one prefix at step 0 covers appends, squashes and re-anchors alike.
#
# That is what `neverEnd = true` was for. It falls out of prefix matching instead of
# needing a flag, which is why K7 retires it.

[[turn]]
id = "blogger"
internal = true
user = "# Write the dense work-log continuation now"

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Session background.", tip = "primitive-obsession" } }

