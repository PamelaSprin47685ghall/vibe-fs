name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version-file: global.json
      - run: npm ci
      - run: dotnet tool restore
      # First opencode launch pays cold binary/package costs; warm before timed tests.
      - run: npm run warmup:opencode
      - run: npm run check
