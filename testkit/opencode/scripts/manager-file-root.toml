[[turn]]
id = "manager"
lane = "fast-manager"
user = "fork a coder with attached file"
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", prompt = "Report the attached-file authority canary is reachable." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Manager file-root canary finished." }

