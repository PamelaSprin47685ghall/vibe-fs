# HOST-004/EXEC-009: a Host restart mid-run must reconcile from the journal, and a
# restored child must still carry the tools its agent declares. The proof is that after
# the restart the Manager can nudge the SAME coder child and get a reply.
#
# ── two files became one ────────────────────────────────────────────────────
#
# The JSON form kept the post-restart edges in `host-restart-after.json` and swapped them
# in mid-run with `loadScripts`. §8 retires that: a scenario is one static file, and a
# restart does not change what the model would say. The old split also hid the real
# claim — that the restored session answers edges declared BEFORE the restart, which is
# only meaningful if they were all declared up front.
#
# The `after` file also carried a second scenario name ("host-restart") with no setup,
# session or flow — a fragment that could not load on its own and had no way to say so.

scenario = "host-restart"
description = "HOST-004 restart reconcile; a restored child retains its coder tools and answers a nudge"
pass = "Host restart reconcile canary passed: restored child retained coder tools across restart."

setup = { strict = true, project = { files = { "AGENTS.md" = "host restart canary\n" } } }
session = { agent = "fast-manager", bind = ["parent-title", "fast-manager"] }
prompt = { agent = "fast-manager", text = "Fork a coder to write host_restart_proof.txt, join, then obtain two PERFECT reviews." }

must = ["guard-nudged.2", "reviewer.1", "manager-after-restart.1", "child-a2"]

flow = [
  { afterExpectation = { id = "guard-nudged.2", restart = true } },

  { wait = "manager.0" },
  { wait = "child-a1" },
  { wait = "manager.2" },
  { wait = "guard-nudged.0" },
  { wait = "reviewer.0" },
  { wait = "reviewer.1" },
  { wait = "guard-nudged.1" },
  { wait = "guard-nudged.2" },

  { awaitRestart = true },

  # The nudge is a fresh user message, so it opens a new turn in the same lane. Nothing
  # is loaded here — the turn below was declared before the Host ever started.
  { prompt = { agent = "fast-manager", text = "Nudge the coder child for child-a2." } },
  { wait = "manager-after-restart.0", timeoutMs = 15000 },
  { wait = "child-a2", timeoutMs = 15000 },
  { wait = "manager-after-restart.1", timeoutMs = 15000 },

  { awaitTerminal = true, requireAssistantTerminal = true },
  { expectSatisfied = true },
]

# Six provider steps, ONE user message. The JSON form wrote these as six edges at
# `lane.turn = 1..6` — a hand-maintained ordinal whose only distinguishing `match` was
# `requiredTools`, identical on all six. Each tool call and its result append assistant
# messages, so `step` counts them and the numbering becomes a property of the request.

[[turn]]
id = "manager"
lane = "fast-manager"
user = "Fork a coder to write host_restart_proof.txt, join, then obtain two PERFECT reviews."
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", prompt = "Write host_restart_proof.txt with OK." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Coder joined." }

# The manager's turn ends here: a text answer to the join result is terminal
# (`CompletedTurnClassifier`), so production never continues to a step 3 in
# THIS turn. The REVIEW-007 guard then nudges the manager with
# production-composed text (guard-nudged below), and the manager answers THAT
# new user message by forking the reviewer — the review flow lives there.

# The restart fires after the guard-nudged review flow completes (`afterExpectation`
# above), so everything below is answered by a reconciled Host reading the journal
# rather than in-memory state.

# REVIEW-003: two PERFECT verdicts from two different ProviderRunIdentity, the second
# proving from its input seal that it consumed the first's challenge. The JSON form used
# `aliases` plus `reusable` on ONE edge — a single declaration pretending to be two runs,
# which is exactly what REVIEW-003 says it may not be.
#
# ── which shape the challenge takes, and why the old form could not say ──────
#
# Production has two paths for delivering `ReviewChallenge.Text`:
#
#   `VerdictTool.fs:64`        returns it as the verdict TOOL RESULT — same user
#                              message, so `step` advances within this turn
#   `HostReviewGuard.fs:189`   sends it as a guard nudge — a NEW user message, so a
#                              new turn whose text is the challenge
#
# The old edge matched `userRegex = "Nope, let's re-evaluate:"`, a substring predicate
# over the conversation. The challenge text is present either way, so that predicate
# matched BOTH shapes and the scenario never said which production path fired.
#
# It is the tool-result path. `reviewer-verdict.json` measured the same production code
# with `afterToolResult: true` — the last user message unchanged after the verdict result
# came back. So these are three steps of one turn, and the nudge path (which exists for
# when the Host goes idle instead of continuing) is not what this scenario exercises.

[[turn]]
id = "reviewer"
lane = "fast-reviewer"
user = ["# Complete the assignment in `assignment`.", "Review and PERFECT twice."]
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  # Step 1: the challenge arrived as the tool result and is already part of the semantic
  # prefix, so the step count says "after the tool result" without a predicate for it.
  # That is what the retired `afterToolResult` flag was expressing one layer less directly.
  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "The second independent PERFECT was accepted for this tree." }

[[turn]]
id = "child-a1"
lane = "fast-coder"
user = ["# Complete the assignment in `assignment`.", "Write host_restart_proof.txt with OK."]

  [[turn.step]]
  respond = { type = "text", text = "child-a1 done." }

# The claim of the whole scenario: this turn is answered AFTER the restart, by a child the
# reconcile restored, and it still has coder tools. Declared here, before the Host starts.

[[turn]]
id = "manager-after-restart"
lane = "fast-manager"
user = "Nudge the coder child for child-a2."
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", prompt = "Report child-a2." } }

  [[turn.step]]
  respond = { type = "text", text = "Finished after restart." }

[[turn]]
id = "child-a2"
lane = "fast-coder"
user = ["# Complete the assignment in `assignment`.", "Report child-a2."]

  [[turn.step]]
  respond = { type = "text", text = "child-a2 done." }

[[turn]]
id = "blogger"
internal = true
user = ["# The next user message is the new session material in TOML.", "[[item]]"]

  [[turn.step]]
  respond = { type = "text", text = "Session background." }

# After a restart the Companion re-anchors with production-composed text
# (`CompanionHostBlogger`, FULL B + projection). It is its own turn (internal:
# no scenario text reaches it).
[[turn]]
id = "blogger-reanchor"
internal = true
user = "You are the blogger of a coding agent session. This session resumed after a restart and your prior companion context was lost."

  [[turn.step]]
  respond = { type = "text", text = "Session background." }

# REVIEW-007: a Manager completing on a tree without a confirmed dual-PERFECT
# is nudged with the production-composed guard text (HostReviewGuard.fs). The
# manager answers that nudge by forking the reviewer, joining after the double
# PERFECT confirms, then finishing (internal: no scenario text reaches the
# nudge itself).
[[turn]]
id = "guard-nudged"
internal = true
user = "# Review is required before completion.\n# Fork or nudge a Reviewer until the current Git tree has two distinct PERFECT verdicts."
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-reviewer", prompt = "Review and PERFECT twice." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Manager completed the review flow." }

[[turn]]
id = "title"
lane = "parent-title"
kind = "title"
user = "Fork a coder to write host_restart_proof.txt, join, then obtain two PERFECT reviews."

  [[turn.step]]
  respond = { type = "title", text = "E2E Test Session" }
