# ORCH-005/REVIEW-003: the full publish chain. Orchestrator forks a Manager, the Manager
# gets work done and is forced through review by the guard, the Orchestrator publishes
# exactly once.
#
# ── two scenarios merged into one ───────────────────────────────────────────
#
# `orchestrator.json` and `orchestrator-publish.json` were isomorphic: same flow verb
# sequence, same 22 edges, same lanes, same review structure. The only differences were the
# proof file name (`role_surface_proof.txt` vs `publish_proof.txt`) and the id spelling
# (`orchestrator-*` vs `orch-*`).
#
# `orchestrator.json` called itself the "tool-surface canary", and its extra content was
# `forbiddenTools` lists. Those are retired: a tool set is part of the request identity, so
# `tools` on the turn declares it, and a DIFFERENT tool set is a different turn rather than
# a filter. The role surface itself is asserted by `tests-mjs/Plugin/manager-tool-contract`,
# which reads the
# schemas directly instead of inferring them from what a mock refused to match.
#
# It was also broken. Its final edge matched `user = "Ship publish_proof.txt…"` — copied
# from the publish scenario — while its own prompt said `role_surface_proof.txt`. So that
# edge could never match, and the canary failed with `no-prefix-matched` before this
# package touched anything. Two near-identical files is exactly how that survives: the
# reader assumes the difference is deliberate.

scenario = "orchestrator-publish"
description = "ORCH-005 fork-manager to publish exactly once, with pre- and post-rebase review confirmation"
pass = "Orchestrator publish canary passed."

setup = { strict = true, project = { files = { "AGENTS.md" = "- orchestrator publish canary\n", "README.md" = "# orchestrator-publish project\n" } } }
session = { agent = "fast-orchestrator", bind = ["orch-title", "fast-orchestrator"] }
prompt = { agent = "fast-orchestrator", text = "Ship publish_proof.txt to the target branch." }

must = ["orch.2"]

flow = [
  { wait = "orch.0" },
  # Nested Host sessions are physically flattened under the family root. The
  # project-wide Host session snapshot binds exact agents without re-deriving the
  # plugin's logical HandleLinked parent from physical `parentID`.
  { bindChild = { agent = "fast-manager", bind = ["fast-manager"] } },
  { wait = "manager.0" },
  { bindChild = { agent = "fast-coder", bind = ["fast-coder"] } },
  { wait = "coder.0" },
  { wait = "coder.1" },
  { wait = "manager.1" },
  { wait = "manager.2" },

  # Pre-rebase review: the guard nudges the Manager (fast-reviewer path) and the
  # Orchestrator raises its own review barrier (deep-reviewer path, ORCH-006). Both
  # reviewers exist; the barrier one is forked by the Orchestrator directly.
  { wait = "manager-guard.0" },
  { bindChild = { agent = "deep-reviewer", bind = ["deep-reviewer"] } },
  { bindChild = { agent = "fast-reviewer", bind = ["fast-reviewer"] } },
  { wait = "reviewer.0" },
  { wait = "reviewer.1" },
  { wait = "reviewer.2" },
  { wait = "manager-guard.1" },
  { wait = "manager-guard.2" },
  # The reviewer's second request carries a grown `parent_work_record` (the parent
  # chain's work record advances as the Manager's Blogger submits), so its wire
  # prefix is not an append-only continuation of the first — a real ARCH-004 break
  # whose cost is one cache miss. Declared, because the turn text itself is stable.
  { wait = "barrier-reviewer.0" },
  { wait = "barrier-reviewer.1" },
  { wait = "barrier-reviewer.2" },
  # Both reviewers submit their second PERFECT in the next provider run. The
  # resulting durable witnesses—not a separate confirmation prompt—are the
  # REVIEW-003 criterion.
  # Two witnesses exist by the time the pre-rebase barrier closes: the Manager
  # guard's fast-reviewer and the Orchestrator's deep-reviewer (ORCH-006). The
  # pre-0.5.0 `OrchestratorPreRebaseReviewConfirmed` fact no longer exists — the
  # confirmation is `ConfirmedReviewWitness` per barrier.
  { waitFact = { name = "ConfirmedReviewWitness", gte = 2 } },

  # Post-rebase review: a second fork, so a second child session bound to the same lane.
  # Its step counter restarts at 0 because it is a fresh conversation — which is why the
  # eight `reviewer-perfect-N` edges of the JSON form are one declaration here.
  { waitFact = { name = "ConfirmedReviewWitness", gte = 3 } },
  { waitFact = { name = "Published", eq = 1 } },

  { wait = "orch.2" },
  { awaitTerminal = true, requireAssistantTerminal = true },
  { assertFile = { path = "publish_proof.txt", equals = "Published by orchestrator canary\n" } },
  # The dirty tree needs one guard review; finalization may expose the committed tree
  # to one later terminal (REVIEW-008). A third delivery is the old self-sustaining loop.
  { assertDeliveries = { id = "manager-guard.0", gte = 1, lte = 2 } },
  { assertWorktreeClean = true },
  { expectSatisfied = true },
]

[[turn]]
id = "orch"
lane = "fast-orchestrator"
user = "Ship publish_proof.txt to the target branch."
tools = ["fork-manager", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork-manager", args = { agent = "fast-manager", prompt = "Ship publish_proof.txt to the target branch." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Publish completed." }

[[turn]]
id = "manager"
lane = "fast-manager"
user = "# Ship publish_proof.txt to the target branch."
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-coder", prompt = "Write publish_proof.txt." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  # REVIEW-007 fires here: a Manager reporting finished on an unreviewed tree is nudged
  # rather than allowed to complete.
  [[turn.step]]
  respond = { type = "text", text = "Manager finished." }

# `HostReviewGuard.fs:202`. Production composes the full two-line message
# (`RuntimeNudge.ManagerReviewGuardInstructions`); the ordered fragments declare
# both lines as they arrive on the wire, so `internal`.

[[turn]]
id = "manager-guard"
internal = true
user = ["# Review is required before completion.", "# Fork or nudge a Reviewer until the current Git tree has two distinct PERFECT verdicts."]
tools = ["fork", "join", "list"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { agent = "fast-reviewer", prompt = "Review the current worktree for correctness" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Manager finished." }

[[turn]]
id = "coder"
lane = "fast-coder"
user = "# Write publish_proof.txt."
tools = ["write"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "write", args = { filePath = "publish_proof.txt", content = "Published by orchestrator canary\n" } }

  [[turn.step]]
  respond = { type = "text", text = "Coder finished." }

# Here the challenge takes the NUDGE shape, not the tool-result shape — the JSON edge had
# `afterToolResult: false` together with the challenge regex, meaning a new user message.
# That is the opposite of `reviewer-verdict`, where the same clause is satisfied through
# `VerdictTool.fs:64`. Both paths are real (`HostReviewGuard.fs:189` is this one); the
# retired substring predicate could not tell them apart, and these two scenarios together
# now pin one each.

[[turn]]
id = "reviewer"
lane = "fast-reviewer"
user = "# Review the current worktree for correctness"
tools = ["verdict"]

  # REVIEW-003 dual PERFECT: the first verdict's tool result IS the challenge
  # (ReviewChallenge.Text), and the second verdict in the NEXT provider run
  # confirms it. A prose reply instead of the second verdict would trip the
  # ReviewerVerdictGuard nudge — a third request this scenario does not declare.
  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "The second independent PERFECT was accepted for this tree." }

# The challenge may also arrive as a guard NUDGE — a NEW user message composed by
# production (`HostReviewGuard.requestPerfectConfirmation`), e.g. when the Host goes
# idle instead of continuing after the tool result. `reviewer-challenge` below covers
# that fallback (production-composed, internal).

[[turn]]
id = "reviewer-challenge"
internal = true
user = "# Nope, let's re-evaluate: does it really fully satisfy the original task without cutting corners?"
tools = ["verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "The second independent PERFECT was accepted for this tree." }

# ORCH-006: the Orchestrator raises its own review barrier with a deep Reviewer
# (`OrchestratorHostReview.DeepReviewerAgent`), independent of the Manager's guard
# path. Its assignment is the barrier's review request, and its verdict tool call
# is the barrier's first PERFECT; the second comes through `reviewer-confirm`.
[[turn]]
id = "barrier-reviewer"
lane = "deep-reviewer"
user = "# Review the current worktree for correctness. Submit your verdict with the verdict tool."
tools = ["glob", "grep", "inspector", "read", "verdict"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "verdict", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Barrier reviewer completed the double PERFECT." }

[[turn]]
id = "blogger"
internal = true
user = "# Write the dense work-log continuation now"

  [[turn.step]]
  respond = { type = "text", text = "Session background." }

[[turn]]
id = "title"
lane = "orch-title"
kind = "title"
user = "Ship publish_proof.txt to the target branch."

  [[turn.step]]
  respond = { type = "title", text = "E2E Test Session" }
