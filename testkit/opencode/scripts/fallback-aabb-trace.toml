# FALLBACK-002/009: the same-run provider-visible A→A→B→B trajectory. This is the
# repository's central No-Go evidence — Offset cycles `(n+1) mod 4` so sides go A, A, B,
# B, and every one of those four attempts is the SAME Logical Run under the same
# Authority Root (no new completion, no cursor reset).
#
# The provider refuses with a non-retryable 400, so the Host stops retrying and the
# plugin must carry the run forward with a `ProviderRetryAttempt` continuation
# (`src/Wanxiangshu.Next/OpenCode/TurnCompletionProgram.fs:92`). That is what makes four attempts
# observable at the wire at all.
#
# ── why five edges became two turns ─────────────────────────────────────────
#
# The JSON form had `req-a2`, `req-b1`, `req-b2` as three separate edges whose `user`
# text was character-identical (the provider-retry nudge). They were told
# apart by `lane.turn = 2|3|4` — a hand-maintained ordinal — and by `match.model`.
#
# Both of those are retired, and correctly so: under (lane, turn, step) the three
# requests ARE one key. Each continuation appends a fresh user message with no assistant
# after it, so each is step 0 of the same turn text. Three deliveries of one key is
# exactly `attempts = [1, 2, 3]`.
#
# The model ids that used to do the disambiguating are now asserted instead of matched.
# §5 forbids a mock from re-deriving domain concepts from the wire, and the effective
# model is decided by `AttemptExecutionProfile` (PROMPT-008) — so it is a CONCLUSION of
# the run, never an input to edge selection. Matching on it let the scenario silently
# agree with whatever the cursor did.

scenario = "fallback-aabb-trace"
description = "FALLBACK-002 provider-visible same-run A/A/B/B; no fifth attempt in the Logical Run"
pass = "Provider-visible same-run A→A→B→B request trajectory proven; recovery continues within the budget."

setup = { strict = true }
session = { agent = "fast-meditator", bind = ["title", "med"] }
prompt = { agent = "fast-meditator", text = "Prove same-run provider AABB trajectory." }

must = []

flow = [
  # A non-retryable provider error does not emit a scenario response signal. The
  # settled assistant snapshot is the only legal wake-up for FALLBACK-003.
  { awaitTerminal = { requireAssistantTerminal = true, requireIdleAfterActivity = true } },
  { waitFact = { name = "FallbackCursorAdvanced", eq = 4 } },

  # The fifth delivery (inside the recovery budget) is the run's last request and the
  # one that completes the Logical Run. Waited on before the trajectory assertion so
  # the request is already recorded: `waitFact` polls on 500ms slices and can observe
  # the fourth failure before the fifth continuation has left the send path.
  { wait = "continue" },

  # The trajectory assertion. Exact list: four settled failures cycle A→A→B→B, then
  # the fifth delivery (Offset 3→0, still inside FALLBACK-005's budget of 12) succeeds
  # and the run completes. The old canary hard-coded a `rawModels.length === 5 → slice(1)`
  # normalization to tolerate a duplicate first attempt, which is assertion weakening
  # of the kind VERIFY-002 forbids. If the Host ever does deliver that duplicate, this
  # must fail and be explained, not absorbed.
  { assertModelTrajectory = { lane = "med", models = ["test-model", "test-model", "test-model-b", "test-model-b", "test-model"] } },
  { custom = "assertFailureEvidence" },

  # Release artifact, written from the list the assertion just verified.
  { custom = "writeTrace" },

  { expectSatisfied = true },
]

# Attempt 1, at Offset 0 → SideA.
[[turn]]
id = "prove"
lane = "med"
user = "Prove same-run provider AABB trajectory."

  [[turn.step]]
  respond = { type = "text", text = "unreachable: every delivery of this step is refused" }

# Attempts 2, 3 and 4 — Offset 1 (SideA), 2 (SideB), 3 (SideB). One key, three
# deliveries. The `respond` text is unreachable here too, and saying so in the text is
# deliberate: a scenario that silently declares content no delivery can return is a
# scenario whose author cannot tell a covered path from an uncovered one.
[[turn]]
id = "continue"
internal = true
user = "# Continue after provider failure."

  [[turn.step]]
  respond = { type = "text", text = "unreachable: every delivery of this step is refused" }

# `retryable = false` is the load-bearing half. A 400 the Host considers retryable would
# make the Host drive the retries and no continuation would ever be sent, so the
# trajectory above would collapse to one user message and the scenario would prove
# nothing about FALLBACK-009.

[[fault]]
turn = "prove"
step = 0
delivery = "provider-error"
status = 400
retryable = false
attempts = [1]

[[fault]]
turn = "continue"
step = 0
delivery = "provider-error"
status = 400
retryable = false
attempts = [1, 2, 3]

# CTX-010: attempt 1 of `continue` is a recovery-slot request and therefore carries
# an attempt-local X prefix probe (the failed `prove` attempt armed the slot, and the
# Companion has coverage). The probe rebases the message prefix while the system
# prompt and tool set stay byte-identical, which ARCH-004 admits as an explicit cold
# boundary. Later deliveries of the same entry are append-only and need no second
# declaration — the boundary is consumed by the request whose break it admitted.
[[epoch]]
turn = "continue"
step = 0
reason = "prefix-probe"

[[turn]]
id = "title"
lane = "title"
kind = "title"
user = "Prove same-run provider AABB trajectory."

  [[turn.step]]
  respond = { type = "title", text = "AABB Trace" }

# COMPANION-002: every Managed Work Session gets exactly one Companion, so a scenario with a
# work session must say what its Blogger replies — otherwise production sends a request the
# forest cannot answer and the run fail-stops.
#
# Measured in K9: four scenarios were missing this, and all four were red before the rewrite
# for exactly this reason. No lane, because the prompt is composed from the delta alone
# (`src/Wanxiangshu.Next/Session/CompanionHostBlogger.fs:77`) and is identical across sessions.
#
# The declared text is the sentence all three production shapes share — delta (:77),
# post-restart re-anchor (:72) and condense (:118) — so one turn answers whichever fires.

# ENFORCER-045: coverage advances only via a completed blog tool cycle.
[[turn]]
id = "blogger"
internal = true
user = "# Write the dense work-log continuation now"

  [[turn.step]]
  respond = { type = "tool-call", tool = "blog", args = { text = "Session background.", "enf-primitive-obsessin" = 7 } }

