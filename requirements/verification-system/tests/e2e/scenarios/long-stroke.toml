# The Long Stroke — G4R-3 sole OpenCode world (changes/active/test.md §4 / §21).
#
# One continuous OpenCode lifetime. Never set afterExpectation.restart /
# flow.restart (recovery = durable facts in the same PID; §12). Observe durable
# facts + public results only — no internal program-counter choreography (§7).
# Wall clock must stay short (§16).
#
# Outer shell = orchestrator (commission → join). Inner Manager walks the
# adversity spine; publish conflict resumes the SAME Manager (ORCH-007).
#
# ── natural story (compressed from orch-unhappy + manager-unhappy + fallback) ─
#
#   Birth (Orchestrator)
#     ↓
#   commission / ManagerJobCreated (AgentOwnerRoot; first suicide migrates Life)
#     ↓
#   Manager forks coder; join blocked; child held incomplete
#     ↓
#   external user_message wakes join (interrupted / reason=user_message)
#     ↓
#   harvest → sole provider-error → FallbackCursorAdvanced eq 1
#     ↓
#   Incumbent #1: audit assigns work on low dimension → exit-required nudge → RetirementCommitted
#     ↓
#   Successor #1: 8×10 independent audit → RetirementCommitted → CandidateReady
#     ↓
#   stale target forces rebase → ConflictDetected (no restart)
#     ↓
#   Successor #2: fresh AuditPending → low-score work assigned → repairs conflict → RetirementCommitted
#     ↓
#   Successor #3: fresh independent re-audit 8×10 → RetirementCommitted → RebasedCandidateReady → Published
#     ↓
#   orch join / expectSatisfied / oracleLongStroke
#
# ── §21 adversity checklist (one representative path each) ───────────────────
#
#   [x] provider transient failure          — [[fault]] provider-error + assertProviderTransientFailure
#   [x] fallback                            — manager.1→continue.0 + assertFallbackContinuation
#   [x] join blocked then causally awakened — flow.prompt wake + assertJoinWakePath
#   [x] non-10 assessment assigns work      — AssessmentCommitted + assertAssessmentAssignsWork
#   [x] interrupted/aborted child or session— holdChildC1UntilLabor + assertInterruptedJoin
#   [x] retirement needs successor          — non-10 blocks publication + successor required + assertRetirementNeedsSuccessor
#   [x] durable recovery/continuation       — same PID FallbackCursorAdvanced + assertDurableRecovery
#   [x] publish conflict / stale target     — gitConflictProof on manager.0 (no restart) + assertPublishConflict
#   [x] subagent session reuse              — successor-2 reuses Proof Writer child + assertSubagentReuse
#   [x] successful reconciliation           — Orchestrator-tagged Published eq 1 + assertSuccessfulReconciliation
#   [x] later successful retirement         — RetirementCommitted after resources converge + assertRetirementCommitted
#   [x] simultaneous Inspector batch        — streamed 3× inspect + assertG2InspectorBatchCoalescing
#
# Yield / hang risks (estimated):
#   - RetirementCommitted waitFact: waits for recursive resource closure
#   - ConflictDetected / Published: rebase+barrier lag; timeouts mirror orch-unhappy (60–90s caps)
#   - interrupt requires holdChildC1UntilLabor; without hold, drain completes child and skips user_message
#   - non-10 assessment assigns WorkOwned; successor independently re-audits before publication
#   - blogger pad undersize → unmatched companion requests (fail closed)
#   - wall <6s target vs orch publish chain — risk of §16 miss until flesh/perf pass
#
# Anchors (lean extract, not a paste): orchestrator-unhappy-path (conflict→Published,
# no restart), manager-unhappy (join wake / low assessment), fallback.toml (sole provider-error).

scenario = "long-stroke"
description = "G4R-3 The Long Stroke: orchestrator shell, one OpenCode world through adversity to clean shutdown"
pass = "Long Stroke orch-shell: join-wake+interrupted/user_message, provider-fallback, audit-low-score→WorkOwned→Retirement→Successor, gitConflictProof→ConflictDetected→RebasedCandidate→Published (no restart)."

# Event ceilings (fail-closed on dead loops; primary over silence watchdog):
#   maxJournalEvents — complete 63-step legal stroke after explicit preflow authority, real K2
#                      StrengthReplica traffic, detached Bookkeeper finalization, and direct
#                      same-physical successor re-audit. Two complete strict traversals measured
#                      622–647 envelopes; 700 catches unconfirmed roster growth
#                      before it can hide behind a widened timeout.
#   maxSseEvents     — OpenCode SSE excluding server.heartbeat for the same traversals measured
#                      3118–3351 frames; 3450 preserves a narrow Host-ordering allowance.
#                      Both pins are machine-checked runaway ceilings, not wall-clock budgets; a
#                      future legitimate topology change must re-measure the complete stroke first.
# magicTodoHostCanary: Phase 0 real-host A/E/G/H wrapper (sole OpenCode lifetime).
setup = { strict = true, magicTodoHostCanary = true, preFlowTurns = ["strength-canary-title", "strength-canary-replica", "strength-canary-replica-continue", "strength-canary-owner", "g2-inspector-owner", "g2-inspector-child-title", "g2-inspector-q1", "g2-inspector-q2", "g2-inspector-q3", "g2-inspector-batch", "g6-bookkeeper-title", "g6-bookkeeper-finalize"], env = { WANXIANGSHU_STRENGTH_MODE = "dry-run", WANXIANGSHU_STRENGTH_DRY_RUN_BUDGET = "K2" }, maxJournalEvents = 600, maxSseEvents = 3000, project = { files = { "AGENTS.md" = "long stroke\n", "README.md" = "# long-stroke\n", "read_probe.txt" = "long-stroke-read-probe\n", ".wanxiang/casebook/.keep" = "" } } }
session = { agent = "orchestrator", bind = ["title", "orchestrator"] }
prompt = { agent = "orchestrator", text = "Ship publish_proof.txt to the target branch through the long stroke." }

must = [
  "g2-inspector-owner.0",
  "g2-inspector-q1.0",
  "g2-inspector-q2.0",
  "g2-inspector-q3.0",
  "g2-inspector-owner.3",
  "g2-inspector-batch.0",
  "g6-bookkeeper-finalize.0",
  "orch.0",
  "manager-audit.0",
  "manager.0",
  "manager.1",
  "continue.0",
  "continue.1",
  "manager-resume.0",
  "manager-exit-required.0",
  "manager-exit-required.1",
  "successor.0",
  "successor.1",
  "successor.2",
  "successor.3",
  "coder.0",
  "coder.1",
  "coder.2",
  "coder-resolve.0",
  # orch.2 = join harvest text after Published (orch-unhappy Stroke 6). EXEC-016
  "orch.2",
]

flow = [
  # STRENGTH-003/011/013 real Host dry-run canary: the first readonly Replica
  # request proves the physical child starts without blocking Owner progress.
  # Request #2 is an optional race tail: it may happen before the exact Owner
  # target terminal, or that causal terminal may close DryRun first. Request #3
  # remains undeclared/fatal. Exact K2 gate sequencing is proved by the
  # time-independent Replica state-machine suite, not by elapsed ordering here.
  { assertDeliveries = { id = "strength-canary-replica.0", eq = 1 } },
  { assertDeliveries = { id = "strength-canary-owner.0", eq = 1 } },
  { assertDeliveries = { id = "g2-inspector-q1.0", eq = 2 } },
  { assertDeliveries = { id = "g2-inspector-q2.0", eq = 1 } },
  { assertDeliveries = { id = "g2-inspector-q3.0", eq = 1 } },
  { assertDeliveries = { id = "g2-inspector-owner.3", eq = 1 } },
  { assertDeliveries = { id = "g2-inspector-batch.0", eq = 1 } },
  { assertDeliveries = { id = "g6-bookkeeper-finalize.0", eq = 1 } },
  { assertFacts = { name = "StrengthCandidatePrepared", eq = 0 } },
  { assertFacts = { name = "InspectorCaseCaptured", gte = 1 } },

  # External injections before any wait (register holds / retire hooks / conflict).
  { custom = "holdChildC1UntilLabor" },
  { custom = "bindRelaySuccessorSequence" },
  # Arm before orch.2 can possibly occur. The final Orchestrator lifetime contains
  # many continuations/idle edges, so its completion barrier is expectation-scoped:
  # orch.2 provider acceptance freezes the SSE baseline, then Stroke 6 waits for
  # the root session idle strictly after that baseline.
  { armIdle = { id = "orch.2" } },
  { armIdle = { id = "coder.3" } },

  # Stale-head AFTER manager worktree exists (orch-unhappy / restart-conflict canary note).
  # gitConflictProof ONLY — zero restart fields (§12 one OpenCode lifetime).
  { afterExpectation = { id = "manager.0", gitConflictProof = true } },

  # Orchestrator Birth → ManagerJob
  { wait = "orch.0" },
  { waitFact = { name = "ManagerJobCreated", eq = 1 } },
  { bindChild = { agent = "manager", bind = ["manager"] } },

  # Incumbent #1 starts read-only. One low dimension atomically assigns work,
  # then the same incumbency can fork → join; join stays in flight while child held.
  # Host evidence (StaticTools.knownToolNames + Manager permission matrix) does not
  # advertise builtin todowrite on Manager provider tools — requiring tools=["todowrite"]
  # here fails toolsGate. A/E/G/H assert uses wire evidence.
  # All Manager prompts MUST use session="child" (bindChild); default session is Orchestrator.
  { wait = "manager-audit.0" },
  { waitFact = { name = "AssessmentCommitted", eq = 1 }, timeoutMs = 60000 },
  { wait = "manager.0" },
  # The held child request proves the forked run is active before the idle join
  # attempt. Without this causal barrier, join may correctly report NothingToJoin
  # while the fork tool is still starting the child provider request.
  { wait = "coder.0", timeoutMs = 60000 },
  { wait = "manager.1", timeoutMs = 60000 },
  { wait = "continue.0", timeoutMs = 60000 },
  { waitFact = { name = "FallbackCursorAdvanced", eq = 1 }, timeoutMs = 60000 },
  # EXEC-017 stimulus must target an ACTIVE join attempt. Provider expectation only
  # proves the model returned a join call; wait for the real Host ToolPart running
  # event before injecting the external user message, or the wake is correctly dropped.
  { custom = "awaitManagerJoinRunning" },
  { prompt = { agent = "manager", text = "Interrupt the active join.", resumeAfterIdleText = "Continue after the interrupted join." }, session = "child", timeoutMs = 60000 },
  { wait = "coder.3", timeoutMs = 60000 },
  { awaitIdle = { after = "coder.3" }, timeoutMs = 60000 },
  { waitFact = { name = "HandleCompleted", gte = 1 }, timeoutMs = 60000 },
  { wait = "manager-resume.0", timeoutMs = 60000 },

  # A WorkOwned incumbent that stops normally receives the typed exit-required
  # nudge. Record final obligations via todowrite, then cleanly suicide.
  { wait = "manager-exit-required.0", timeoutMs = 60000 },
  { wait = "manager-exit-required.1", timeoutMs = 60000 },
  { waitFact = { name = "RetirementCommitted", gte = 1 }, timeoutMs = 60000 },
  { waitFact = { name = "SuccessorActivated", gte = 1 }, timeoutMs = 60000 },

  # Successor #1 independently audits the current snapshot at 8×10 and retires.
  # That quality candidate reaches Change; the stale target forces rebase and the
  # deliberately conflicting target edit yields the machine ConflictDetected fact.
  { wait = "successor.0", timeoutMs = 60000 },
  { wait = "successor.1", timeoutMs = 60000 },
  { waitFact = { name = "AssessmentCommitted", gte = 2 }, timeoutMs = 60000 },
  { waitFact = { name = "RetirementCommitted", gte = 2 }, timeoutMs = 60000 },
  { waitFact = { name = "CandidateReady", eq = 1 }, timeoutMs = 60000 },
  { waitFact = { name = "ConflictDetected", gte = 1 }, timeoutMs = 60000 },

  # Successor #2 is a fresh AuditPending incumbency. Its low assessment assigns
  # WorkOwned; it reuses the original Proof Writer child to repair the conflict,
  # then retires. The retired predecessor never regains WorkOwned.
  { waitFact = { name = "SuccessorActivated", gte = 2 }, timeoutMs = 60000 },
  { waitFact = { name = "AssessmentCommitted", gte = 3 }, timeoutMs = 60000 },
  { wait = "successor.1", timeoutMs = 60000 },
  { wait = "coder-resolve.0", timeoutMs = 60000 },
  { wait = "coder-resolve.1", timeoutMs = 60000 },
  { wait = "successor.2", timeoutMs = 60000 },
  { wait = "successor.3", timeoutMs = 60000 },
  { waitFact = { name = "RetirementCommitted", gte = 3 }, timeoutMs = 60000 },

  # Successor #3 independently re-audits the repaired snapshot at 8×10. A fresh
  # certificate is required before rebase completion/publish can proceed.
  { waitFact = { name = "SuccessorActivated", gte = 3 }, timeoutMs = 60000 },
  { waitFact = { name = "AssessmentCommitted", gte = 4 }, timeoutMs = 60000 },
  { waitFact = { name = "RetirementCommitted", gte = 4 }, timeoutMs = 60000 },
  { waitFact = { name = "RebasedCandidateReady", gte = 1 }, timeoutMs = 90000 },
  # Bare "Published" false-matches assignment text; pin Orchestrator case tag.
  { waitFact = { name = "\"Orchestrator\",[\"Published\"", eq = 1 }, timeoutMs = 90000 },

  # Stroke 6 — Orchestrator harvest (same as orch-unhappy: orch.2 after Published).
  # awaitIdle is anchored at the actual orch.2 request, not at the lifetime-wide
  # initial prompt cursor; this remains edge-race safe even when idle lands before
  # the flow reaches this line.
  { wait = "orch.2", timeoutMs = 60000 },
  { awaitIdle = { after = "orch.2" }, timeoutMs = 60000 },
  { custom = "oracleLongStroke" },
  { assertDeliveries = { id = "coder.1", eq = 1 } },
  { custom = "assertG6ColdFetch" },
  # Real-host A/E/G/H — production obligation membrane + pure-observer wrapper artifacts.
  { custom = "assertHostCanariesAEGH" },
  { expectSatisfied = true },
]

[[turn]]
id = "protocol-repair"
internal = true
user = "# Protocol repair"

  [[turn.step]]
  respond = { type = "tool-call", tool = "chronicle", args = { entry = "Protocol repair.", tip = "primitive-obsession" } }

[[turn]]
id = "strength-canary-title"
lane = "strength-canary-owner"
kind = "title"
user = "STRENGTH_HOST_CANARY: inspect README.md through the real nested Replica path."

  [[turn.step]]
  respond = { type = "title", text = "Strength Host Canary" }

[[turn]]
id = "strength-canary-replica"
internal = true
user = "STRENGTH_HOST_CANARY: inspect README.md through the real nested Replica path."
tools = ["glob", "grep", "read"]
forbiddenTools = ["edit"]

  [[turn.step]]
  respond = { type = "tool-calls", calls = [{ tool = "read", args = { filePath = "README.md" } }, { tool = "read", args = { filePath = "AGENTS.md" } }] }

[[turn]]
id = "strength-canary-replica-continue"
internal = true
user = "STRENGTH_HOST_CANARY: inspect README.md through the real nested Replica path."
tools = ["glob", "grep", "read"]
forbiddenTools = ["edit"]

  [[turn.step]]
  runtimeStep = 1
  optional = true
  respond = { type = "text", text = "Strength replica inspection completed." }

[[epoch]]
turn = "strength-canary-replica-continue"
step = 1
reason = "prefix-probe"
optional = true

[[turn]]
id = "strength-canary-owner"
lane = "strength-canary-owner"
user = "STRENGTH_HOST_CANARY: inspect README.md through the real nested Replica path."

  [[turn.step]]
  respond = { type = "text", text = "Strength dry-run canary owner completed." }

[[turn]]
id = "g2-inspector-owner"
lane = "g2-inspector-owner"
user = "G2_INSPECTOR_PREFIX_CANARY: reuse one inspector for Q1, Q2, then Q3."
tools = ["inspect"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "inspect", args = { charge = "G2Q1: who owns PromptAuthority?" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "inspect", args = { charge = "G2Q2: what is ReuseScope?" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "inspect", args = { charge = "G2Q3: when does CaseFinalize run?" } }

  [[turn.step]]
  respond = { type = "tool-calls", streamCalls = true, yieldBetweenChunks = true, calls = [{ tool = "inspect", args = { charge = "G2B1: establish the first repository fact." } }, { tool = "inspect", args = { charge = "G2B2: establish the second repository fact." } }, { tool = "inspect", args = { charge = "G2B3: establish the third repository fact." } }] }

  [[turn.step]]
  respond = { type = "text", text = "G2 inspector prefix and batch canary owner completed." }

[[turn]]
id = "g2-inspector-child-title"
internal = true
kind = "title"
user = "G2Q1: who owns PromptAuthority?"

  [[turn.step]]
  respond = { type = "title", text = "G2 Inspector Child" }

[[turn]]
id = "g2-inspector-q1"
internal = true
user = "# G2Q1: who owns PromptAuthority?"

  [[turn.step]]
  respond = { type = "text", text = "G2A1: Host owns PromptAuthority." }

[[turn]]
id = "g2-inspector-q2"
internal = true
user = "# G2Q2: what is ReuseScope?"

  [[turn.step]]
  respond = { type = "text", text = "G2A2: Owner session scope for one Inspector." }

[[turn]]
id = "g2-inspector-q3"
internal = true
user = "# G2Q3: when does CaseFinalize run?"

  [[turn.step]]
  respond = { type = "text", text = "G2A3: On owner ReuseScope close." }

[[turn]]
id = "g2-inspector-batch"
internal = true
user = ["# G2B1: establish the first repository fact.", "# G2B2: establish the second repository fact.", "# G2B3: establish the third repository fact."]

  [[turn.step]]
  respond = { type = "text", text = "G2B: all three repository facts were established together." }

[[turn]]
id = "g2-inspector-replica"
internal = true
user = "G2_INSPECTOR_PREFIX_CANARY: reuse one inspector for Q1, Q2, then Q3."
tools = ["glob", "grep", "read"]
forbiddenTools = ["edit", "write", "inspect"]

  [[turn.step]]
  respond = { type = "text", text = "G2 replica shadow completed." }

[[turn]]
id = "g6-bookkeeper-title"
internal = true
kind = "title"
user = "CaseFinalize"

  [[turn.step]]
  respond = { type = "title", text = "G6 Bookkeeper Finalize" }

[[turn]]
id = "g6-bookkeeper-finalize"
internal = true
user = ["# # Common Law", "CaseFinalize"]
tools = ["js-bookkeeper"]
forbiddenTools = ["inspect", "write", "edit", "bash-honeypot"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "js-bookkeeper", args = { program = "class Js extends JsProgram { async run() { this.setQuestion(\"What is the Inspector reuse contract?\"); this.setAnswer(\"One Inspector child, serial Q/A, finalize on owner close.\"); return { changed: true }; } }" } }

  [[turn.step]]
  respond = { type = "text", text = "Bookkeeper CaseFinalize idle." }

[[turn]]
id = "title"
lane = "title"
kind = "title"
user = "Ship publish_proof.txt to the target branch through the long stroke."

  [[turn.step]]
  respond = { type = "title", text = "Long Stroke" }

[[turn]]
id = "orch"
lane = "orchestrator"
user = "Ship publish_proof.txt to the target branch through the long stroke."
tools = ["commission", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "commission", args = { calling = "lead", name = "Long Stroke Road", charge = "Run the long stroke: ship publish_proof.txt — join-wake, provider fallback, accept the assessment obligation then retire so publish can proceed." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  # Join stays blocked until Manager Published; then this harvest text (required).
  [[turn.step]]
  respond = { type = "text", text = "Long stroke publish completed after conflict resume." }

# EXEC-016 / INTERACTION-AUTHORITY-014: conditional protocol declaration only.
# Ordinary Orchestrator completion receives JoinGuard exactly when a join obligation
# still has outstanding managed background. Long Stroke does not force that state;
# if it occurs physically, strict mock still recognizes the canonical continuation.
[[turn]]
id = "orch-join-guard"
internal = true
user = "# Work remains away."
tools = ["commission", "horizon", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "text", text = "Arrived consequences received; continue the orchestration." }

# AgentOwnerRoot Manager (opening is "#" + orch fork prompt). Fork + join; join
# stays blocked while holdChild keeps coder incomplete for user_message wake.
# tools MUST match the real Manager provider surface (no todowrite — see flow note).
[[turn]]
id = "manager-t1-commitment"
internal = true
user = "# The account is not yet ready to entrust."

  [[turn.step]]
  respond = { type = "tool-call", tool = "todowrite", args = { planComplete = true, workingOn = "long-stroke", obligations = [{ name = "long-stroke", horizon = "near", work = "Run the long stroke through publish_proof.txt." }] } }

  [[turn.step]]
  respond = { type = "text", text = "T1 commitment recorded." }

[[turn]]
id = "manager-audit"
lane = "manager"
user = "# Run the long stroke: ship publish_proof.txt — join-wake, provider fallback, accept the assessment obligation then retire so publish can proceed."
tools = ["read", "glob", "grep", "fork", "join", "horizon", "review", "suicide"]

  [[turn.step]]
  runtimeStep = 0
  respond = { type = "tool-call", tool = "review", prefixText = "The workspace needs implementation work before it can publish: completeness is not yet full because publish_proof.txt has not been established on this Road.", args = { language_algorithms = 10, simplicity = 10, structure = 10, granularity = 10, tests_evidence = 10, logic_reliability_boundaries = 10, caller_ergonomics = 10, completeness = 9 } }

[[turn]]
id = "manager"
lane = "manager"
user = "# Run the long stroke: ship publish_proof.txt — join-wake, provider fallback, accept the assessment obligation then retire so publish can proceed."
tools = ["fork", "join", "horizon", "suicide"]

  [[turn.step]]
  runtimeStep = 1
  respond = { type = "tool-call", tool = "fork", args = { calling = "coder", name = "Proof Writer", charge = "Write publish_proof.txt." } }

  [[turn.step]]
  runtimeStep = 2
  respond = { type = "tool-call", tool = "join", args = {} }

[[turn]]
id = "continue"
internal = true
user = "# The previous physical attempt did not complete.\n#\n# Continue the same work from the evidence already before you.\n#\n# The failed attempt itself is not evidence about the task.\n"

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "text", text = "The active join yielded to the newer user message." }

[[turn]]
id = "manager-interrupt"
lane = "manager"
user = "Interrupt the active join."
tools = ["fork", "join", "horizon", "fission", "todowrite", "suicide"]
optional = true

  [[turn.step]]
  respond = { type = "text", text = "The active join was interrupted and the child result was harvested." }

  [[turn.step]]
  respond = { type = "text", text = "Interruption handled; continue the durable Manager job." }

[[turn]]
id = "manager-resume"
lane = "manager"
user = "Continue after the interrupted join."
tools = ["fork", "join", "horizon", "fission", "todowrite", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  optional = true
  respond = { type = "text", text = "The interrupted child has returned; this incumbency now stops normally and awaits the exit protocol." }

[[turn]]
id = "manager-exit-required"
internal = true
user = "# You are still the active Manager. A normal assistant stop does not end an incumbency."
tools = ["join", "todowrite", "suicide"]

  # A nudge that lands on a clean stop opens at step 1 (assistant dot was inserted).
  # Record the final obligation account via todowrite, then cleanly suicide at step 2.
  [[turn.step]]
  runtimeStep = 1
  respond = { type = "tool-call", tool = "todowrite", args = { planComplete = true, workingOn = "long-stroke", obligations = [{ name = "long-stroke", horizon = "near", work = "Run the long stroke through publish_proof.txt." }] } }

  [[turn.step]]
  runtimeStep = 2
  respond = { type = "tool-call", tool = "suicide", args = {} }

  [[turn.step]]
  runtimeStep = 3
  optional = true
  respond = { type = "tool-call", tool = "join", args = {} }

[[turn]]
id = "successor"
internal = true
user = "# The previous Manager incumbency is retired. You are the new Manager for the same user Road."
tools = ["read", "glob", "grep", "fork", "join", "horizon", "review", "suicide"]

  # The causal binder makes delivery #1 and #3 perfect, delivery #2 low.
  [[turn.step]]
  runtimeStep = 0
  respond = { type = "tool-call", tool = "review", prefixText = "Independent audit of this successor snapshot finds every required quality dimension complete and supported by the current workspace evidence.", args = { language_algorithms = 10, simplicity = 10, structure = 10, granularity = 10, tests_evidence = 10, logic_reliability_boundaries = 10, caller_ergonomics = 10, completeness = 10 } }

  # Delivery #1/#3 retires a perfect candidate. Delivery #2 is rebound to fork
  # the already-known Proof Writer session for conflict repair.
  [[turn.step]]
  runtimeStep = 1
  respond = { type = "tool-call", tool = "fork", args = { name = "Proof Writer", charge = "Resolve the conflicted publish_proof.txt so it contains exactly: Published by long-stroke canary" } }

  [[turn.step]]
  runtimeStep = 2
  respond = { type = "tool-call", tool = "join", args = {} }

  # Successor #2 only: after the conflict child returns, the low-score incumbent
  # retires without self-review. Successor #1/#3 leave at step 1.
  [[turn.step]]
  runtimeStep = 3
  respond = { type = "tool-call", tool = "suicide", args = {} }

[[turn]]
id = "coder"
lane = "coder"
user = "# Write publish_proof.txt."
tools = ["js-coder", "read"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "js-coder", args = { program = "class Js extends JsProgram { async run() { await this.write('publish_proof.txt', 'Published by long-stroke canary\\n'); return { written: true }; } }" } }

  # G6 cold fetch rides the first later Coder child instead of spawning a
  # dedicated proof-only root/Companion/title session. It is still a new Host
  # session after CaseFinalize and therefore proves the same persisted read path.
  [[turn.step]]
  respond = { type = "tool-call", tool = "fetch", args = { shelfmark = "$inspector-case" } }

  # Native-read failure probe: ordinary Coder mainline, not Strength Replica.
  # Unique path makes message.part.updated correlation unambiguous in the real Host SSE stream.
  [[turn.step]]
  respond = { type = "tool-call", tool = "read", args = { filePath = "read_probe.txt" } }

  [[turn.step]]
  respond = { type = "text", text = "Coder finished." }

[[turn]]
id = "coder-resolve"
lane = "coder"
user = "# Resolve the conflicted publish_proof.txt so it contains exactly: Published by long-stroke canary"
tools = ["write"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "write", args = { filePath = "publish_proof.txt", content = "Published by long-stroke canary\n" } }

  [[turn.step]]
  respond = { type = "text", text = "Conflict file resolved." }

