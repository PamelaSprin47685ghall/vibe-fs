internal = true
user = ["# # Common Law", "CaseFinalize"]
tools = ["js-bookkeeper"]
forbiddenTools = ["inspect", "write", "edit", "bash-honeypot"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "js-bookkeeper", args = { program = "class Js extends JsProgram { async run() { this.setQuestion(\"What is the Inspector reuse contract?\"); this.setAnswer(\"One Inspector child, serial Q/A, finalize on owner close.\"); return { changed: true }; } }" } }

  [[turn.step]]
