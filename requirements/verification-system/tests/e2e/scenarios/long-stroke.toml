# G2 inspector transient provider error on attempt 1: host/provider retries, attempt 2 delivers A1.
[[fault]]
turn = "g2-inspector-q1"
step = 0
delivery = "provider-error"
status = 500
retryable = true
attempts = [1]

# Sole physical fault: one settled non-retryable provider-error (no AABB here).
[[fault]]
turn = "manager"
step = 2
delivery = "provider-error"
status = 400
retryable = false
attempts = [1]

