id = "coder"
lane = "coder"
user = "# Write publish_proof.txt."
tools = ["js-coder", "read"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "js-coder", args = { program = "class Js extends JsProgram { async run() { await this.write('publish_proof.txt', 'Published by long-stroke canary\\n'); return { written: true }; } }" } }

  # G6 cold fetch rides the first later Coder child instead of spawning a
