[[fault]]
turn = "continue"
step = 0
delivery = "provider-error"
status = 400
retryable = false
attempts = [1]

# Pure loop: each owner-opened incarnation reseals at the exact assessment resource
# (`manager-reopened-loop.0` above) while preserving the authority prefix, the provider
# plan, and the predecessor's retained history. The authority turn itself establishes the
# seal once; it no longer reseals, because the successor never trims that history away.
[[epoch]]
