# The Long Stroke — G4R-3 sole OpenCode world (changes/active/test.md §4 / §21).
#
# One continuous OpenCode lifetime. Never set afterExpectation.restart /
# flow.restart (recovery = durable facts in the same PID; §12). Observe durable
# facts + public results only — no internal program-counter choreography (§7).
# Wall clock must stay short (§16).
#
# Outer shell = orchestrator (commission → join). Inner Manager walks the
# adversity spine; publish conflict resumes the SAME Manager (ORCH-007).
#
# ── natural story (compressed from orch-unhappy + manager-unhappy + fallback) ─
#
#   Birth (Orchestrator)
#     ↓
#   commission / ManagerJobCreated (AgentOwnerRoot; first suicide migrates Life)
#     ↓
#   Manager forks engineer; join blocked; child held incomplete
#     ↓
#   external user_message wakes join (interrupted / reason=user_message)
#     ↓
#   harvest → provider-error → recovery provider-error → FailureRecorded eq 2 → success
#     ↓
#   Iteration #1: audit assigns work on low dimension → current-action nudge → RetirementCommitted(Continue) → IncumbencyOpened
#     ↓
#   Iteration #2: 8×10 independent audit → RetirementCommitted(Continue) → CandidateReady
#     ↓
#   stale target forces rebase → ConflictDetected (no restart)
#     ↓
#   Iteration #3: same authority, fresh IncumbencyOpened → low-score work assigned → repairs conflict → RetirementCommitted(Continue)
#     ↓
#   Iteration #4: same authority, fresh IncumbencyOpened → independent re-audit 8×10 → RetirementCommitted(Accepted) → RebasedCandidateReady → Published
#     ↓
#   orch join / expectSatisfied / oracleLongStroke
#
# ── §21 adversity checklist (one representative path each) ───────────────────
#
#   [x] provider transient failure          — [[fault]] provider-error + assertProviderTransientFailure
#   [x] provider failure continuation       — manager.1→continue.0 + assertProviderFailureContinuation
#   [x] join blocked then causally awakened — flow.prompt wake + assertJoinWakePath
#   [x] non-10 assessment assigns work      — AssessmentCommitted + assertAssessmentAssignsWork
#   [x] interrupted/aborted child or session— holdChildC1UntilLabor + assertInterruptedJoin
#   [x] retirement needs next iteration     — non-10 blocks publication + Continue → fresh IncumbencyOpened + assertRetirementNeedsIteration
#   [x] durable recovery/continuation       — same PID FailureRecorded + assertDurableRecovery
#   [x] publish conflict / stale target     — gitConflictProof on manager-loop.1 (no restart) + assertPublishConflict
#   [x] successful reconciliation           — Orchestrator-tagged Published eq 1 + assertSuccessfulReconciliation
#   [x] later successful retirement         — RetirementCommitted after resources converge + assertRetirementCommitted
#
# Yield / hang risks (estimated):
#   - RetirementCommitted waitFact: waits for recursive resource closure
#   - ConflictDetected / Published: rebase+barrier lag; timeouts mirror orch-unhappy (60–90s caps)
#   - interrupt requires holdChildC1UntilLabor; without hold, drain completes child and skips user_message
#   - non-10 assessment assigns work; the next iteration independently re-audits before publication
#   - blogger pad undersize → unmatched companion requests (fail closed)
#   - wall <6s target vs orch publish chain — risk of §16 miss until flesh/perf pass
#
# Anchors (lean extract, not a paste): orchestrator-unhappy-path (conflict→Published,
# no restart), manager-unhappy (join wake / low assessment), fallback.toml (consecutive provider failures).

scenario = "long-stroke"
description = "G4R-3 The Long Stroke: orchestrator shell, one OpenCode world through adversity to clean shutdown"
pass = "Long Stroke orch-shell: join-wake+interrupted/user_message, provider-fallback, audit-low-score→Continue→IncumbencyOpened→Accepted, gitConflictProof→ConflictDetected→RebasedCandidate→Published (no restart)."

routingSource = '''
const candidates = ['test/test-model', 'opencode/test-model', 'backup/test-model']
const failed = new Set()
const providerOf = (model) => model.slice(0, model.indexOf('/'))
export const markProviderFailed = (provider) => failed.add(provider)
export const hasTheoreticalCapacity = () => true


  if (!new Set(['manager', 'orchestrator', 'engineer', 'devops', 'blogger', 'bookkeeper', 'predictor']).has(role)) {
    throw new Error('unexpected managed role: ' + role)
  }
  if (role !== 'manager') return previous ?? { model: candidates[0], reasoning: 'none' }
  if (previous != null && !failed.has(providerOf(previous.model))) return previous
  const model = candidates.find((candidate) => !failed.has(providerOf(candidate)))
  return { model: model ?? candidates.at(-1), reasoning: 'none' }
}
'''

# Event ceilings (fail-closed on dead loops; primary over silence watchdog):
#   maxJournalEvents — complete 56-step legal stroke after explicit preflow authority, real K2
#                      StrengthReplica traffic, detached Bookkeeper finalization, and direct
#                      same-physical iteration re-audit. Complete canaries measured ≤466 envelopes.
#   maxSseEvents     — OpenCode SSE excluding server.heartbeat; complete canaries measured ≤2234 frames.
#                      Pins 699/3351 retain 50% above observed maxima while failing fast on loops.
#                      Both are machine-checked runaway ceilings, not wall-clock budgets; a future
#                      legitimate topology change must re-measure the complete stroke first.
setup = { strict = true, preFlowTurns = ["strength-canary-title", "strength-canary-replica", "strength-canary-replica-continue", "strength-canary-owner", "humanroot-manager-title", "humanroot-loop"], env = { WANXIANGSHU_STRENGTH_MODE = "dry-run", WANXIANGSHU_STRENGTH_DRY_RUN_BUDGET = "K2" }, maxJournalEvents = 699, maxSseEvents = 3351, project = { files = { "AGENTS.md" = "long stroke\n", "README.md" = "# long-stroke\n", "read_probe.txt" = "long-stroke-read-probe\n", ".wanxiang/casebook/.keep" = "" } } }
session = { agent = "orchestrator", bind = ["title", "orchestrator"] }
prompt = { agent = "orchestrator", text = "Ship publish_proof.txt to the target branch through the long stroke." }

must = [
  "humanroot-loop.0",
  "humanroot-loop.1",
  "orch.0",
  "manager-loop.0",
  "manager-loop.1",
  "manager-loop.2",
  "continue.0",
  "engineer.0",
  "engineer.1",
  "engineer.2",
  "engineer-resolve.0",
  # orch.2 = join harvest text after Published (orch-unhappy Stroke 6). EXEC-016
  "orch.2",
]

flow = [
  # STRENGTH-003/011/013 real Host dry-run canary: the first readonly Replica
  # request proves the physical child starts without blocking Owner progress.
  # Request #2 is an optional race tail: it may happen before the exact Owner
  # target terminal, or that causal terminal may close DryRun first. Request #3
  # remains undeclared/fatal. Exact K2 gate sequencing is proved by the
  # time-independent Replica state-machine suite, not by elapsed ordering here.
  { assertDeliveries = { id = "strength-canary-replica.0", eq = 1 } },
  { assertDeliveries = { id = "strength-canary-owner.0", eq = 1 } },
  { assertFacts = { name = "StrengthCandidatePrepared", eq = 0 } },

  # External injections before any wait (register holds / retire hooks / conflict).
  { custom = "holdChildC1UntilLabor" },
  # Arm before orch.2 can possibly occur. The final Orchestrator lifetime contains
  # many continuations/idle edges, so its completion barrier is expectation-scoped:
  # orch.2 provider acceptance freezes the SSE baseline, then Stroke 6 waits for
  # the root session idle strictly after that baseline.
  { armIdle = { id = "orch.2" } },
  { armIdle = { id = "engineer.2" } },
  { armIdle = { id = "manager-interrupt.0" } },

  # Stale-head AFTER manager worktree exists (orch-unhappy / restart-conflict canary note).
  # gitConflictProof ONLY — zero restart fields (§12 one OpenCode lifetime).
  { afterExpectation = { id = "manager-loop.1", gitConflictProof = true } },

  # Orchestrator Birth → ManagerJob
  { wait = "orch.0" },
  { waitFact = { name = "ManagerJobCreated", eq = 1 } },
  { bindChild = { agent = "manager", bind = ["manager"] } },

  # Iteration #1 starts read-only. One low dimension atomically assigns work,
  # then the current iteration can fork → join; join stays in flight while child held.
  # Host evidence (StaticTools.knownToolNames + Manager permission matrix) does not
  # advertise a builtin todowrite; the session cognitive tool is `assume` (update +
  # todos), so requiring tools=["todowrite"] here fails toolsGate. The Manager surface
  # claim is proven from wire evidence at the end of the stroke.
  # All Manager prompts MUST use session="child" (bindChild); default session is Orchestrator.
  # The initial HumanRoot prompt and every owner-opened incarnation reuse the same
  # authority-first manager-loop entry; the binder varies review results by durable attempt.
  { wait = "manager-loop.0" },
  # Manager loop first main assessment (session = "child"): precisely 1 for this road/branch,
  # decoupled from preflow/world AssessmentCommitted total.
  { waitFact = { name = "AssessmentCommitted", eq = 1, session = "child" }, timeoutMs = 60000 },
  { wait = "manager-loop.1" },
  # The held child request proves the forked run is active before the idle join
  # attempt. Without this causal barrier, join may correctly report NothingToJoin
  # while the fork tool is still starting the child provider request.
  { wait = "engineer.0", timeoutMs = 60000 },
  { wait = "manager-loop.2", timeoutMs = 60000 },
  { wait = "continue.0", attempts = 2, timeoutMs = 60000 },
  { waitFact = { name = "FailureRecorded", eq = 2 }, timeoutMs = 60000 },
  # EXEC-017 stimulus must target an ACTIVE join attempt. Provider expectation only
  # proves the model returned a join call; wait for the real Host ToolPart running
  # event before injecting the external user message, or the wake is correctly dropped.
  { custom = "awaitManagerJoinRunning" },
  { prompt = { agent = "manager", text = "Interrupt the active join.", releaseHeldChildAfterAccepted = true }, session = "child", timeoutMs = 60000 },
  { wait = "manager-interrupt.0", timeoutMs = 60000 },
  { wait = "engineer.2", timeoutMs = 60000 },
  { awaitIdle = { after = "engineer.2" }, timeoutMs = 60000 },
  { awaitIdle = { after = "manager-interrupt.0" }, timeoutMs = 60000 },
  { waitFact = { name = "HandleCompleted", gte = 1 }, timeoutMs = 60000 },

  # Bounded current-action cursors are verified by durable retirement and the
  # Host cognitive-tool canary (assume) rather than one incidental transport step number.
  # HumanRoot preflow baseline: +2 RetirementCommitted(Continue+Accepted) / +2 IncumbencyOpened.
  # A Continue retirement is followed by another ordinary IncumbencyOpened event
  # and a physically observed provider request; Accepted exits.
  { waitFact = { name = "RetirementCommitted", gte = 3 }, timeoutMs = 60000 },
  { waitFact = { name = "IncumbencyOpened", gte = 4 }, timeoutMs = 60000 },

  # Iteration #2 independently audits the current snapshot at 8×10 and retires
  # with Outcome Continue. Every iteration starts from the same typed authority
  # user messages and current workspace.
  # That quality candidate reaches Change; the stale target forces rebase and the
  # deliberately conflicting target edit yields the machine ConflictDetected fact.
  # The Manager owner opens iteration #2 through the same manager-assess resource.
  # Durable facts order every later incarnation; prompt text never encodes an index.
  { waitFact = { name = "AssessmentCommitted", gte = 4 }, timeoutMs = 60000 },
  { waitFact = { name = "RetirementCommitted", gte = 4 }, timeoutMs = 60000 },
  { waitFact = { name = "CandidateReady", eq = 1 }, timeoutMs = 60000 },
  { waitFact = { name = "ConflictDetected", gte = 1 }, timeoutMs = 60000 },

  # Iteration #3 is a fresh IncumbencyOpened on the same authority. Its low
  # assessment assigns a fresh Conflict Resolver child to repair the conflict,
  # then retires with Outcome Continue. A retired iteration
  # never resumes; each iteration-first carries only the current iteration, with
  # the exact owner-controlled assessment resource after the authority prefix.
  { waitFact = { name = "IncumbencyOpened", gte = 5 }, timeoutMs = 60000 },
  { waitFact = { name = "AssessmentCommitted", gte = 5 }, timeoutMs = 60000 },
  { wait = "engineer-resolve.0", timeoutMs = 60000 },
  { wait = "engineer-resolve.1", timeoutMs = 60000 },
  { awaitIdle = { after = "engineer-resolve.1" }, timeoutMs = 60000 },
  # The conflict repair uses the same manager-work resource and a fresh owned handle;
  # the owner harvests and retires it without an external continuation prompt.
  { waitFact = { name = "RetirementCommitted", gte = 5 }, timeoutMs = 60000 },

  # Iteration #4 independently re-audits the repaired snapshot at 8×10 from the
  # same authority. A fresh certificate (Outcome Accepted) is required before
  # rebase completion/publish can proceed; Accepted exits with no further iteration.
  { waitFact = { name = "IncumbencyOpened", gte = 6 }, timeoutMs = 60000 },
  { waitFact = { name = "AssessmentCommitted", gte = 6 }, timeoutMs = 60000 },
  { waitFact = { name = "RetirementCommitted", gte = 6 }, timeoutMs = 60000 },
  { waitFact = { name = "RebasedCandidateReady", gte = 1 }, timeoutMs = 90000 },
  { waitFact = { name = "Published", eq = 1 }, timeoutMs = 90000 },

  # Stroke 6 — Orchestrator harvest (same as orch-unhappy: orch.2 after Published).
  # awaitIdle is anchored at the actual orch.2 request, not at the lifetime-wide
  # initial prompt cursor; this remains edge-race safe even when idle lands before
  # the flow reaches this line.
  { wait = "orch.2", timeoutMs = 60000 },
  { awaitIdle = { after = "orch.2" }, timeoutMs = 60000 },
  { custom = "oracleLongStroke" },
  { assertDeliveries = { id = "engineer.1", eq = 1 } },
  # Production Manager tool surface, observed on the wire the Host actually sent.
  { custom = "assertManagerToolSurfaceOnWire" },
  { expectSatisfied = true },
]

