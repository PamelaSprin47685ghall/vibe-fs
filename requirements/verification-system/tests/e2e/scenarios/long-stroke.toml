lane = "needhelp-owner"
kind = "title"
user = "NEEDHELP_LONG_STROKE_CANARY: ask for help as fast, then deep, then finish after advice."

  [[turn.step]]
  respond = { type = "title", text = "NEEDHELP Long Stroke Canary" }

[[turn]]
id = "needhelp-owner-fast"
lane = "needhelp-owner"
user = "NEEDHELP_LONG_STROKE_CANARY: ask for help as fast, then deep, then finish after advice."

  [[turn.step]]
  respond = { type = "text", reasoningOnly = "[NEEDHELP]" }

[[turn]]
id = "needhelp-owner-deep"
lane = "needhelp-owner"
user = "# You just requested collaboration. Continue the same charge now with stronger reasoning in the same role."

  [[turn.step]]
  respond = { type = "text", reasoningOnly = "[NEEDHELP]" }

[[epoch]]
turn = "needhelp-owner-deep"
step = 0
reason = "assistance-side"

[[turn]]
id = "needhelp-consult-title"
internal = true
kind = "title"
user = "# How should this agent resolve its current difficulty?"

  [[turn.step]]
  respond = { type = "title", text = "NEEDHELP Consultation" }

[[turn]]
id = "needhelp-consult"
internal = true
user = "# How should this agent resolve its current difficulty?"

  [[turn.step]]
  respond = { type = "text", text = "Independent NEEDHELP perspective: preserve the original charge, verify the strongest assumption, then continue." }

[[turn]]
id = "needhelp-owner-advice"
lane = "needhelp-owner"
user = "# Below is the canonical child→parent LifecycleWorkRecord from an independent consultation."

  [[turn.step]]
  respond = { type = "text", text = "NEEDHELP Long Stroke canary resumed on the original deep binding and completed." }

[[turn]]
id = "g2-inspector-title"
lane = "g2-inspector-owner"
kind = "title"
user = "G2_INSPECTOR_PREFIX_CANARY: reuse one inspector for Q1, Q2, then Q3."

  [[turn.step]]
  respond = { type = "title", text = "G2 Inspector Prefix Canary" }

[[turn]]
id = "g2-inspector-owner"
lane = "g2-inspector-owner"
user = "G2_INSPECTOR_PREFIX_CANARY: reuse one inspector for Q1, Q2, then Q3."
tools = ["inspect"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "inspect", args = { charge = "G2Q1: who owns PromptAuthority?" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "inspect", args = { charge = "G2Q2: what is ReuseScope?" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "inspect", args = { charge = "G2Q3: when does CaseFinalize run?" } }

  [[turn.step]]
  respond = { type = "text", text = "G2 inspector prefix canary owner completed." }

[[turn]]
id = "g2-inspector-child-title"
internal = true
kind = "title"
user = "G2Q1: who owns PromptAuthority?"

  [[turn.step]]
  respond = { type = "title", text = "G2 Inspector Child" }

[[turn]]
id = "g2-inspector-q1"
internal = true
user = "G2Q1: who owns PromptAuthority?"

  [[turn.step]]
  respond = { type = "text", text = "G2A1: Host owns PromptAuthority." }

[[turn]]
id = "g2-inspector-q2"
internal = true
user = "G2Q2: what is ReuseScope?"

  [[turn.step]]
  respond = { type = "text", text = "G2A2: Owner session scope for one Inspector." }

[[turn]]
id = "g2-inspector-q3"
internal = true
user = "G2Q3: when does CaseFinalize run?"

  [[turn.step]]
  respond = { type = "text", text = "G2A3: On owner ReuseScope close." }

[[turn]]
id = "g6-bookkeeper-title"
internal = true
kind = "title"
user = "CaseFinalize"

  [[turn.step]]
  respond = { type = "title", text = "G6 Bookkeeper Finalize" }

[[turn]]
id = "g6-bookkeeper-finalize"
internal = true
user = ["# # Common Law", "CaseFinalize"]
tools = ["js-bookkeeper"]
forbiddenTools = ["inspect", "write", "edit", "bash-honeypot"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "js-bookkeeper", args = { program = "class Js extends JsProgram { async run() { this.setQuestion(\"What is the Inspector reuse contract?\"); this.setAnswer(\"One Inspector child, serial Q/A, finalize on owner close.\"); return { changed: true }; } }" } }

  [[turn.step]]
  respond = { type = "text", text = "Bookkeeper CaseFinalize idle." }

[[turn]]
id = "title"
lane = "title"
kind = "title"
user = "Ship publish_proof.txt to the target branch through the long stroke."

  [[turn.step]]
  respond = { type = "title", text = "Long Stroke" }

[[turn]]
id = "orch"
lane = "fast-orchestrator"
user = "Ship publish_proof.txt to the target branch through the long stroke."
tools = ["commission", "join"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "commission", args = { calling = "coordinator", name = "Long Stroke Road", charge = "Run the long stroke: ship publish_proof.txt — join-wake, provider fallback, accept REVISE then reach a blessed ending so publish can reconcile." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  # Join stays blocked until Manager Published; then this harvest text (required).
  [[turn.step]]
  respond = { type = "text", text = "Long stroke publish completed after conflict resume." }

# AgentOwnerRoot Manager (opening is "#" + orch fork prompt). Fork + join; join
# stays blocked while holdChild keeps coder incomplete for user_message wake.
# tools MUST match the real Manager provider surface (no todowrite — see flow note).
[[turn]]
id = "manager-blind-plan"
internal = true
user = "# The account is not yet ready to entrust."

  [[turn.step]]
  respond = { type = "tool-call", tool = "todowrite", args = { planComplete = true, obligations = [{ name = "long-stroke", work = "Run the long stroke through publish_proof.txt." }] } }

  [[turn.step]]
  respond = { type = "text", text = "Blind plan obligations recorded." }

# Dedicated Magic Todo process reviewer for the first accepted obligation account.
# Hidden reviewer is not part of the main flow; strict mock still declares its
# real verdict + terminal text so the process review can conclude durably.
[[turn]]
id = "manager-process-review"
internal = true
user = "You are reviewing the ongoing quality and truthfulness of a work process."
tools = ["judge"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "judge", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Process review confirms the long-stroke obligation account." }

[[turn]]
id = "manager"
lane = "fast-manager"
user = "# Run the long stroke: ship publish_proof.txt — join-wake, provider fallback, accept REVISE then reach a blessed ending so publish can reconcile."
tools = ["fork", "join", "horizon", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { calling = "coder", name = "Proof Writer", charge = "Write publish_proof.txt." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

[[turn]]
id = "mgr-labor"
lane = "fast-manager"
user = "Also make sure publish_proof.txt has exactly the content 'Published by long-stroke canary' before the end."
tools = ["fork", "join", "horizon", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "premature" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "text", text = "Join harvested after user_message wake; continue." }

[[turn]]
id = "continue"
internal = true
user = "# The previous physical attempt did not complete."

  [[turn.step]]
  respond = { type = "text", text = "long-stroke fallback continuation completed." }

[[epoch]]
turn = "continue"
step = 0
reason = "prefix-probe"

# GLORY-029 normal Manager idle continuation. The first physical occasion is
# refused by the sole provider-error fault; fallback then causes a second
# physical occasion. Both are the same declared step and therefore share one
# delivery counter. The successful second occasion owns the rest of the Manager
# tool loop, so no same-lane external prompt races it.
[[turn]]
id = "manager-idle"
internal = true
user = ["# You have done useful work, and useful action may still remain.", "# Time spent is not time exhausted.", "# A long road is still a road.", "# Look again at what the mission still owes.", "# If useful action remains, continue.", "# When nothing useful remains, seek your end."]
tools = ["fork", "join", "horizon", "fission", "todowrite", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "first ending" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { calling = "coder", name = "Proof Finisher", charge = "Ensure publish_proof.txt contains exactly: Published by long-stroke canary" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join", args = {} }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "publish_proof.txt is ready." } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "suicide", args = { last_words = "publish_proof.txt is ready." } }

  [[turn.step]]
  respond = { type = "text", text = "Manager rest in peace." }

[[epoch]]
turn = "manager-idle"
step = 0
reason = "prefix-probe"

[[turn]]
id = "coder"
lane = "fast-coder"
user = "# Write publish_proof.txt."
tools = ["write", "read"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "write", args = { filePath = "publish_proof.txt", content = "Published by long-stroke canary\n" } }

  # G6 cold fetch rides the first later Coder child instead of spawning a
  # dedicated proof-only root/Companion/title session. It is still a new Host
  # session after CaseFinalize and therefore proves the same persisted read path.
  [[turn.step]]
  respond = { type = "tool-call", tool = "fetch", args = { shelfmark = "$inspector-case" } }

  # Native-read failure probe: ordinary Coder mainline, not Strength Replica.
  # Unique path makes message.part.updated correlation unambiguous in the real Host SSE stream.
  [[turn.step]]
  respond = { type = "tool-call", tool = "read", args = { filePath = "read_probe.txt" } }

  [[turn.step]]
  respond = { type = "text", text = "Coder finished." }

[[turn]]
id = "coder-fix"
lane = "fast-coder"
user = "# Ensure publish_proof.txt contains exactly: Published by long-stroke canary"
tools = ["write"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "write", args = { filePath = "publish_proof.txt", content = "Published by long-stroke canary\n" } }

  [[turn.step]]
  respond = { type = "text", text = "Coder repaired proof file." }

# Host finality OpeningAssignment. bindFinalityReviseThenPerfect retires REVISE
# after .1 and activates dual-PERFECT turn (same OpeningAssignment otherwise ties).
[[turn]]
id = "manager-finality-revise"
internal = true
user = "# Review the current worktree against all authoritative user requirements."
tools = ["judge"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "judge", args = { verdict = "REVISE" } }

  [[turn.step]]
  respond = { type = "text", text = "Finality reviewer rejects the ending." }

[[turn]]
id = "manager-finality-reviewer"
internal = true
user = "# Review RETIRED long-stroke finality — inactive until revise cohort ends."
tools = ["judge"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "judge", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "judge", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Manager finality reviewer confirmed." }

# ORCH-007 conflict resume — same Manager session; do NOT restart original task.
[[turn]]
id = "conflict-resume"
internal = true
user = "[CONFLICT RESUMPTION] An in-progress rebase hit conflicts. Conflicted files:"
tools = ["fork", "join", "horizon", "suicide"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "fork", args = { calling = "coder", name = "Conflict Resolver", charge = "Resolve the conflicted publish_proof.txt so it contains exactly: Published by long-stroke canary" } }

  [[turn.step]]
  respond = { type = "tool-call", tool = "join" }

  [[turn.step]]
  respond = { type = "text", text = "Conflict resolved; rebase can continue." }

[[turn]]
id = "coder-resolve"
lane = "fast-coder"
user = "# Resolve the conflicted publish_proof.txt so it contains exactly: Published by long-stroke canary"
tools = ["write"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "write", args = { filePath = "publish_proof.txt", content = "Published by long-stroke canary\n" } }

  [[turn.step]]
  respond = { type = "text", text = "Conflict file resolved." }

[[turn]]
id = "barrier-reviewer"
internal = true
user = "# Review the current worktree for correctness. Submit your verdict with the verdict tool."
tools = ["glob", "grep", "read", "judge"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "judge", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "First barrier PERFECT submitted; awaiting challenge." }

[[turn]]
id = "reviewer-confirm"
internal = true
user = "# Nope, let's re-evaluate: does it really fully satisfy the original task without cutting corners?"
tools = ["judge"]

  [[turn.step]]
  respond = { type = "tool-call", tool = "judge", args = { verdict = "PERFECT" } }

  [[turn.step]]
  respond = { type = "text", text = "Reviewer confirmed the tree." }


